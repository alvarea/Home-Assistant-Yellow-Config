        content: "{% from 'alarm_homy.jinja' import detalle_apagado %}{{ detalle_apagado('armed_home') }}"
      - type: markdown
        grid_options:
          columns: 12
        content: "{% from 'alarm_homy.jinja' import detalle_apagado %}{{ detalle_apagado('armed_night') }}"
    - type: grid
      cards:
      - show_state: false
        show_name: true

###############################################################################
#  ALARM HOMY · Dashboard "Alarma HOMY" (/alarma-homy)
#
#  Copia del dashboard en modo UI (storage: .storage/lovelace.alarma_homy).
#  Exportado: 2026-10-16 23:10 (vistas: Alarma, Sensores Activos, Estado Sensores Alarma, Cámaras, Configuración Alarma, Configuración Sensores Habilitados)
#  Restaurar: Ajustes → Paneles → Alarma HOMY → Editar → ⋮ Editor de configuración
#             en bruto → pegar este contenido (las líneas de comentario se ignoran).
#  Imágenes: /local/Home_Alarm_Security_I*.jpg|webp (www/, fuera de git).
###############################################################################
title: Alarma HOMY
views:
  - title: Alarma
    path: alarma
    icon: mdi:shield-home
    type: sections
    max_columns: 4
    sections:
    - type: grid
      cards:
      - show_state: false
        show_name: true
        camera_view: auto
        fit_mode: cover
        type: picture-entity
        entity: alarm_control_panel.alarm_homy
        name: Estado
        image:
          media_content_id: /local/Home_Alarm_Security_I3.jpg
        tap_action:
          action: none
        hold_action:
          action: none
        grid_options:
          columns: 12
        aspect_ratio: '3'
      - type: heading
        icon: mdi:account-convert
        heading: Presencia
        heading_style: title
        badges:
        - type: entity
          entity: binary_sensor.family_any_home
        - type: entity
          entity: binary_sensor.family_all_home
        - type: entity
          entity: sensor.family_home
        - type: entity
          entity: sensor.family_sleep_home
      - cards:
        - cards:
          - type: tile
            entity: person.agustin
            show_entity_picture: true
            vertical: true
            state_content: last_changed
          - type: custom:mushroom-person-card
            entity: person.malen
            icon_type: entity-picture
            layout: vertical
            fill_container: true
            secondary_info: last-changed
          - type: custom:mushroom-person-card
            entity: person.agu
            icon_type: entity-picture
            layout: vertical
            fill_container: true
            secondary_info: last-changed
          - type: custom:mushroom-person-card
            entity: person.paloma
            icon_type: entity-picture
            layout: vertical
            fill_container: true
            secondary_info: last-changed
          type: horizontal-stack
        type: vertical-stack
      - type: heading
        icon: mdi:security
        heading: ALARMA PRINCIPAL HOMY
        heading_style: title
        badges:
        - type: entity
          show_state: true
          show_icon: true
          entity: alarm_control_panel.alarm_homy
        grid_options:
          rows: 1
          columns: full
      - features:
        - type: alarm-modes
          modes:
          - disarmed
          - armed_away
        type: custom:mushroom-template-card
        entity: alarm_control_panel.alarm_homy
        grid_options:
          columns: 12
        primary: '{% set e = states(''alarm_control_panel.alarm_homy'') %}{% set m = {''disarmed'':''Desarmada'',''arming'':''Armando…'',''armed_home'':''Armada Casa'',''armed_night'':''Armada Noche'',''armed_away'':''Armada Ausente'',''armed_vacation'':''Armada Vacaciones'',''pending'':''¡Entrada detectada!'',''triggered'':''¡ALARMA DISPARADA!''} %}{{ m.get(e, e) | upper }}'
        secondary: '{% set e = states(''alarm_control_panel.alarm_homy'') %}{% set modo = {''armed_home'':''Casa'',''armed_night'':''Noche'',''armed_away'':''Ausente'',''armed_vacation'':''Vacaciones''}.get(states(''input_select.alarm_homy_modo''), '''') %}{% if e in [''pending'',''triggered'',''arming''] and modo %}{{ modo }} · {% endif %}desde {{ as_local(states.alarm_control_panel.alarm_homy.last_changed).strftime(''%H:%M'') }}'
        icon: '{% set e = states(''alarm_control_panel.alarm_homy'') %}{{ {''disarmed'':''mdi:shield-off'',''arming'':''mdi:shield-sync'',''armed_home'':''mdi:home-account'',''armed_night'':''mdi:weather-night'',''armed_away'':''mdi:home-export-outline'',''armed_vacation'':''mdi:airplane'',''pending'':''mdi:shield-alert'',''triggered'':''mdi:alarm-light''}.get(e,''mdi:shield'') }}'
        tap_action:
          action: more-info
        color: '{% set e = states(''alarm_control_panel.alarm_homy'') %}{{ {''disarmed'':''green'',''arming'':''amber'',''armed_home'':''purple'',''armed_night'':''blue'',''armed_away'':''orange'',''armed_vacation'':''deep-orange'',''pending'':''red'',''triggered'':''red''}.get(e,''grey'') }}'
        features_position: bottom
        area: 9d6ff7118aff4fe1a55c43a4c9b9583e
        multiline_secondary: true
        badge_icon: mdi:home-lock
        badge_color: green
      - type: entity
        entity: sensor.alarm_homy_restante_salida
        name: Salida · tiempo para salir
        icon: mdi:timer-sand
        grid_options:
          columns: 12
        visibility:
        - condition: state
          entity: timer.alarm_homy_salida
          state: active
        tap_action:
          action: more-info
      - type: entity
        entity: sensor.alarm_homy_restante_entrada
        name: Entrada · tiempo para desarmar
        icon: mdi:timer-alert-outline
        grid_options:
          columns: 12
        visibility:
        - condition: state
          entity: timer.alarm_homy_entrada
          state: active
        tap_action:
          action: more-info
      - type: entity
        entity: sensor.alarm_homy_restante_disparo
        name: Disparo · sirena
        icon: mdi:alarm-light
        grid_options:
          columns: 12
        visibility:
        - condition: state
          entity: timer.alarm_homy_disparo
          state: active
        tap_action:
          action: more-info
      - type: heading
        icon: mdi:cctv
        heading: ALARMA CAMARAS BLINK
        heading_style: title
        badges:
        - type: entity
          show_state: true
          show_icon: true
          entity: alarm_control_panel.blink_casa
        grid_options:
          rows: 1
          columns: full
      - features:
        - type: alarm-modes
          modes:
          - disarmed
          - armed_away
        type: custom:mushroom-template-card
        entity: alarm_control_panel.blink_casa
        grid_options:
          columns: 12
        primary: '{% set e = states(''alarm_control_panel.blink_casa'') %}{% set m = {''disarmed'':''Desarmada'',''arming'':''Armando…'',''armed_home'':''Armada Casa'',''armed_night'':''Armada Noche'',''armed_away'':''Armada Ausente'',''armed_vacation'':''Armada Vacaciones'',''pending'':''¡Entrada detectada!'',''triggered'':''¡ALARMA DISPARADA!''} %}{{ m.get(e, e) | upper }}'
        secondary: desde {{ as_local(states.alarm_control_panel.blink_casa.last_changed).strftime('%H:%M') }}
        icon: '{% set e = states(''alarm_control_panel.blink_casa'') %}{{ {''disarmed'':''mdi:shield-off'',''arming'':''mdi:shield-sync'',''armed_home'':''mdi:home-account'',''armed_night'':''mdi:weather-night'',''armed_away'':''mdi:home-export-outline'',''armed_vacation'':''mdi:airplane'',''pending'':''mdi:shield-alert'',''triggered'':''mdi:alarm-light''}.get(e,''mdi:shield'') }}'
        tap_action:
          action: more-info
        color: '{% set e = states(''alarm_control_panel.blink_casa'') %}{{ {''disarmed'':''cyan'',''arming'':''amber'',''armed_away'':''indigo'',''armed_home'':''indigo'',''armed_night'':''indigo'',''pending'':''red'',''triggered'':''red''}.get(e,''grey'') }}'
        features_position: bottom
        area: 9d6ff7118aff4fe1a55c43a4c9b9583e
        multiline_secondary: true
        badge_icon: mdi:cctv
        badge_color: cyan
    - type: grid
      cards:
      - show_state: false
        show_name: true
        camera_view: auto
        fit_mode: cover
        type: picture-entity
        entity: alarm_control_panel.alarm_homy
        name: Armado
        image:
          media_content_id: /local/Home_Alarm_Security_I4.jpg
        tap_action:
          action: none
        hold_action:
          action: none
        grid_options:
          columns: 12
        aspect_ratio: '3'
      - type: tile
        entity: binary_sensor.alarm_homy_lista_para_armar
        name: Lista para armar
        state_content:
        - state
        - abiertos
        grid_options:
          columns: 12
        color: green
        icon: mdi:shield-check
        visibility:
        - condition: state
          entity: binary_sensor.alarm_homy_lista_para_armar
          state: 'on'
      - type: tile
        entity: binary_sensor.alarm_homy_no_lista_para_armar
        name: No lista para armar
        state_content:
        - abiertos
        grid_options:
          columns: 12
        color: amber
        icon: mdi:shield-alert
        visibility:
        - condition: state
          entity: binary_sensor.alarm_homy_lista_para_armar
          state: 'off'
      - type: tile
        grid_options:
          columns: 12
        entity: sensor.alarm_homy_averias
        name: Sensores con averías (sin comunicación)
        icon: mdi:access-point-network-off
        color: amber
        state_content:
        - state
        - nombres
        vertical: false
        features_position: bottom
      - type: custom:mushroom-template-card
        entity: binary_sensor.alarm_homy_actividad_estudio
        grid_options:
          columns: 12
        primary: '{% set on = is_state(''binary_sensor.alarm_homy_actividad_estudio'', ''on'') %}Arriba: {{ state_attr(''binary_sensor.alarm_homy_actividad_estudio'', ''motivos'') if on else ''sin actividad'' }}'
        secondary: '{% set est = states(''input_select.alarm_homy_estado'') %}{% if est == ''armed_home'' and is_state(''input_boolean.alarm_homy_noche_pendiente'', ''on'') %}Casa nocturno → Noche en el próximo check ({{ (now() + timedelta(hours=1)).strftime(''%H'') }}:00) o tras 15 min sin actividad arriba{% elif est == ''armed_night'' %}Noche: planta alta vigilada{% else %}Armar Noche con actividad arriba arma Casa y sube a Noche cuando quede libre{% endif %}'
        icon: '{{ ''mdi:weather-night-partly-cloudy'' if is_state(''input_boolean.alarm_homy_noche_pendiente'', ''on'') else (''mdi:desk'' if is_state(''binary_sensor.alarm_homy_actividad_estudio'', ''on'') else ''mdi:desk-lamp-off'') }}'
        color: '{{ ''purple'' if is_state(''input_boolean.alarm_homy_noche_pendiente'', ''on'') else (''blue'' if is_state(''binary_sensor.alarm_homy_actividad_estudio'', ''on'') else ''grey'') }}'
        multiline_secondary: true
        tap_action:
          action: more-info
        hold_action:
          action: none
      - type: tile
        entity: alarm_control_panel.alarm_homy
        name: Desarmar
        icon: mdi:shield-off
        color: green
        show_entity_picture: false
        state_content:
        - state
        - last_changed
        vertical: false
        grid_options:
          columns: 12
          rows: 1
        icon_tap_action:
          action: more-info
        tap_action:
          action: more-info
      - type: tile
        entity: button.alarm_homy_armar_casa
        color: purple
        show_entity_picture: false
        hide_state: false
        state_content: info
        vertical: false
        grid_options:
          columns: 12
          rows: 1
        icon_tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.alarm_homy_armar_casa
          confirmation:
            text: ¿Armar Casa?
        tap_action:
          action: more-info
      - type: tile
        entity: button.alarm_homy_armar_noche
        color: blue
        show_entity_picture: false
        hide_state: false
        state_content: info
        vertical: false
        grid_options:
          columns: 12
          rows: 1
        icon_tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.alarm_homy_armar_noche
          confirmation:
            text: ¿Armar Noche?
        tap_action:
          action: more-info
      - type: tile
        entity: button.alarm_homy_armar_ausente
        color: orange
        show_entity_picture: false
        hide_state: false
        state_content: info
        vertical: false
        grid_options:
          columns: 12
          rows: 1
        icon_tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.alarm_homy_armar_ausente
          confirmation:
            text: ¿Armar Ausente?
        tap_action:
          action: more-info
      - type: tile
        entity: button.alarm_homy_armar_vacaciones
        color: deep-orange
        show_entity_picture: false
        hide_state: false
        state_content: info
        vertical: false
        grid_options:
          columns: 12
          rows: 1
        icon_tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.alarm_homy_armar_vacaciones
          confirmation:
            text: ¿Armar Vacaciones?
        tap_action:
          action: more-info
    - type: grid
      cards:
      - show_state: false
        show_name: true
        camera_view: auto
        fit_mode: cover
        type: picture-entity
        entity: sensor.alarm_homy_disparo
        name: Último disparo
        image:
          media_content_id: /local/Home_Alarm_Security_I7.jpg
        tap_action:
          action: none
        hold_action:
          action: none
        grid_options:
          columns: 12
        aspect_ratio: '3'
      - type: tile
        entity: sensor.alarm_homy_disparo
        name: Sensor
        icon: mdi:alarm-light
        state_content:
        - state
        - area
        - hora
        grid_options:
          columns: 12
      - type: markdown
        title: Detalle
        grid_options:
          columns: 12
        content: '{% set d = state_attr(''sensor.alarm_homy_disparo'',''detalles'') or [] %}{% if d %}{% for x in d %}- {{ x }}

          {% endfor %}{% else %}Sin disparos desde el último armado.{% endif %}'
      - type: tile
        entity: sensor.alarm_homy_disparo
        name: Origen
        icon: mdi:source-branch
        state_content:
        - origen
        grid_options:
          columns: 12
      - type: tile
        entity: sensor.alarm_homy_disparo
        name: Sensores del disparo
        icon: mdi:format-list-bulleted
        state_content:
        - lista
        grid_options:
          columns: 12
    - type: grid
      cards:
      - show_state: false
        show_name: true
        camera_view: auto
        fit_mode: cover
        type: picture-entity
        entity: alarm_control_panel.alarm_homy
        name: Registro
        image:
          media_content_id: /local/Home_Alarm_Security_I2.jpg
        tap_action:
          action: none
        hold_action:
          action: none
        grid_options:
          columns: 12
        aspect_ratio: '3'
      - type: logbook
        hours_to_show: 72
        target:
          entity_id:
          - alarm_control_panel.alarm_homy
          - sensor.alarm_homy_disparo
          - input_boolean.alarm_homy_noche_pendiente
        grid_options:
          columns: 12
          rows: 8

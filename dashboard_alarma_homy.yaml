        secondary: '{% set est = states(''input_select.alarm_homy_estado'') %}{% if est == ''armed_home'' and is_state(''input_boolean.alarm_homy_noche_pendiente'', ''on'') %}Casa nocturno → Noche en el próximo check ({{ (now() + timedelta(hours=1)).strftime(''%H'') }}:00) o tras 15 min sin actividad arriba{% elif est == ''armed_night'' %}Noche: planta alta vigilada{% else %}Armar Noche con actividad arriba arma Casa y sube a Noche cuando quede libre{% endif %}'
        icon: '{{ ''mdi:weather-night-partly-cloudy'' if is_state(''input_boolean.alarm_homy_noche_pendiente'', ''on'') else (''mdi:desk'' if is_state(''binary_sensor.alarm_homy_actividad_estudio'', ''on'') else ''mdi:desk-lamp-off'') }}'
        color: '{{ ''purple'' if is_state(''input_boolean.alarm_homy_noche_pendiente'', ''on'') else (''blue'' if is_state(''binary_sensor.alarm_homy_actividad_estudio'', ''on'') else ''grey'') }}'

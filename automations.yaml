#  alias: ZHA Exterior Philips Hue Smart Button
- id: ZHA_L1
  alias: ZHA Exterior Philips Hue Smart Button
  mode: queued
  # Pulsador Hue Smart Button (ROM001) de la entrada
  #   corta  → luz exterior on/off
  #   doble  → comprobar estado de la alarma (voz Alexa)       [Alarm HOMY]
  #   larga  → PÁNICO SONORO                                   [Alarm HOMY]
  triggers:
    - device_id: 9b4a8d38607a9f81ccdffab704cd03e2
      domain: zha
      trigger: device
      type: remote_button_short_press
      subtype: turn_on
      id: short_press
    - device_id: 9b4a8d38607a9f81ccdffab704cd03e2
      domain: zha
      trigger: device
      type: remote_button_double_press
      subtype: turn_on
      id: double_press
    - device_id: 9b4a8d38607a9f81ccdffab704cd03e2
      domain: zha
      trigger: device
      type: remote_button_long_press
      subtype: turn_on
      id: long_press
  conditions: []
  actions:
    - action: input_text.set_value
      target:
        entity_id: input_text.helper_hue_smart_button_entrada
      data:
        value: >-
          {{ trigger.id }} - {{ {'short_press': 'luz exterior', 'double_press': 'comprobar alarma', 'long_press': 'PANICO SILENCIOSO'}[trigger.id] }}
    - choose:
        # Corta: enciende/apaga luz exterior
        - conditions:
            - condition: trigger
              id: short_press
          sequence:
            - action: light.toggle
              target:
                entity_id: light.luz_exterior
        # Doble: estado de la alarma y si está lista para armar → Alexa
        - conditions:
            - condition: trigger
              id: double_press
          sequence:
            - action: script.alarm_homy_comprobar
        # Larga: pánico SILENCIOSO (2026-10-12: por si hay coacción al entrar; antes sonoro)
        - conditions:
            - condition: trigger
              id: long_press
          sequence:
            - action: script.alarm_homy_panico
              data:
                tipo: panico_silencioso
                origen: Pulsador Hue entrada

#  alias: ZHA Dormitorio MFC Philips HUE Dimmer
- id: ZHA_L2
  alias: ZHA Dormitorio MFC Philips HUE Dimmer
  mode: queued
  # Hue Dimmer Switch RWL021 vía puente Hue (no ZHA). Botones Hue v2: 1 ON, 2 subir, 3 bajar, 4 OFF.
  # (2026-10-31) ZHA-01: hereda el mapeo del IKEA Tradfri (ZHA_L12, retirada; el Tradfri queda para ALA-44).
  # Short_press ON
  # Short_press OFF
  # Long_Press subir
  # Long_Press bajar
  #
  triggers:
    - device_id: 6d03bddf142f8d9bc26f8d2c6b0b6574
      domain: hue
      trigger: device
      type: short_release
      subtype: 1
      unique_id: 1c516f4a-4308-4850-9abf-92580baa26d3
      id: on_short_press # ==> Dos lamparas on
    - device_id: 6d03bddf142f8d9bc26f8d2c6b0b6574
      domain: hue
      trigger: device
      type: short_release
      subtype: 4
      unique_id: cb163d45-a542-4190-a1ee-ee9c6a48ecab
      id: off_short_press # ==> Dos lamparas off
    - device_id: 6d03bddf142f8d9bc26f8d2c6b0b6574
      domain: hue
      trigger: device
      type: long_press
      subtype: 2
      unique_id: 7e5eb0cb-55cd-4dd3-b8c4-2bc171ac6027
      id: dim_up # Lampara AAC toggle
    - device_id: 6d03bddf142f8d9bc26f8d2c6b0b6574
      domain: hue
      trigger: device
      type: long_press
      subtype: 3
      unique_id: 4d4add4a-9a33-4d65-90e6-86065c256de7
      id: dim_down # Lampara MFC toggle
  conditions: []
  actions:
    - choose:
        # IF trigger.id = on_short_press ==> Dos lamparas on
        - conditions:
          - condition: trigger
            id: on_short_press
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.luces_dormitorio_mfc
        # ELIF off_short_press Dos lamparas OFF
        - conditions:
          - condition: trigger
            id: off_short_press
          sequence:
            # Apaga luces dormitorio con retardo variable en función de la hora
            - action: light.turn_off
              data:
                transition: >
                  {% if now().hour >= 0 and now().hour <= 7 %} 5
                  {% elif now().hour >= 8 and now().hour <= 19 %} 0
                  {% else %} 3
                  {% endif %}
              target:
                entity_id: light.luces_dormitorio_mfc
        # ELIF dim_up => Lampara AAC toggle
        - conditions:
          - condition: trigger
            id: dim_up
          sequence:
            - action: light.toggle
              data: {}
              target:
                entity_id: light.luz_dormitorio_agustin
        # ELIF dim_down => Lampara MFC toggle
        - conditions:
          - condition: trigger
            id: dim_down
          sequence:
            - action: light.toggle
              data: {}
              target:
                entity_id: light.luz_dormitorio_malen

#  alias: ZHA Entrada IKEA Rodret Alarma HOMY
- id: ZHA_L3
  alias: ZHA Entrada IKEA Rodret Alarma HOMY
  mode: single
  # IKEA RODRET (sensor.ikea_dimmer_switch_alarma_homy), junto al tag reader de la entrada.
  # (2026-10-11) Reutilizado: antes alternaba switch.esphome_pow_sw2 (lavadora, hoy riego tomates).
  #   Botón "O" (0, command off) → Armar CASA       [Alarm HOMY]
  #   Botón "I" (1, command on)  → Armar AUSENTE    [Alarm HOMY]
  #   Desarmar NO se hace desde un botón físico (NFC, iPhone o código).
  triggers:
    - trigger: event
      event_type: zha_event
      event_data:
        device_id: 0a43ad4d68f6c171709761fb9a09e579
        command: 'off'
        cluster_id: 6
        endpoint_id: 1
      id: armed_home
    - trigger: event
      event_type: zha_event
      event_data:
        device_id: 0a43ad4d68f6c171709761fb9a09e579
        command: 'on'
        cluster_id: 6
        endpoint_id: 1
      id: armed_away
  conditions: []
  actions:
    - action: script.alarm_homy_armar
      data:
        modo: "{{ trigger.id }}"
        origen: Pulsador RODRET entrada

#  alias: ZHA Salon IKEA Styrbar Dimmer
- id: ZHA_L4
  alias: ZHA Salon IKEA Styrbar Dimmer
  mode: queued
  # Realiza un ciclo cada vez que se pulsa en el boton left-right
  # scene.dormitorio_full, scene.dormitorio_lectura, scene.dormitorio_relax, scene.dormitorio_noche
  #
  # Event Type: remote_button_short_press, remote_button_double_press
  # Event Subtype: turn_on, turn_off, dim_up, dim_down
  #
  triggers:
    - device_id: 3ec2d334b192909aca8ef449baa4dda0
      domain: zha
      trigger: device
      type: remote_button_short_press
      subtype: turn_on
      id: on_short_press
    - device_id: 3ec2d334b192909aca8ef449baa4dda0
      domain: zha
      trigger: device
      type: remote_button_short_press
      subtype: turn_off
      id: off_short_press
    - device_id: 3ec2d334b192909aca8ef449baa4dda0
      domain: zha
      trigger: device
      type: remote_button_short_press
      subtype: left
      id: left
    - device_id: 3ec2d334b192909aca8ef449baa4dda0
      domain: zha
      trigger: device
      type: remote_button_short_press
      subtype: right
      id: right
    - device_id: 3ec2d334b192909aca8ef449baa4dda0
      domain: zha
      trigger: device
      type: remote_button_long_press
      subtype: dim_up
      id: dim_up
    - device_id: 3ec2d334b192909aca8ef449baa4dda0
      domain: zha
      trigger: device
      type: remote_button_long_press
      subtype: dim_down
      id: dim_down
  conditions: []
  # input_text.helper_ikea_dimmer_switch_salon
  actions:
    - choose:
        # IF trigger.id = on_short_press
        - conditions:
          - condition: trigger
            id: on_short_press
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.salon_noche
            - action: input_text.set_value
              data:
                value: "turn_on scene.salon_noche"
              target:
                entity_id: input_text.helper_ikea_dimmer_switch_salon
        # ELIF off_short_press
        - conditions:
          - condition: trigger
            id: off_short_press
          sequence:
            - action: light.turn_off
              target:
                entity_id: light.luces_salon
            - action: input_text.set_value
              data:
                value: "turn_off light.luces_salon"
              target:
                entity_id: input_text.helper_ikea_dimmer_switch_salon
        # ELIF left
        - conditions:
          - condition: trigger
            id: left
          sequence:
            - action: input_select.select_previous
              data:
                cycle: true
              target:
                entity_id: input_select.helper_scene_salon
            - action: scene.turn_on
              target:
                entity_id: "{{ states('input_select.helper_scene_salon')}}"
            - action: input_text.set_value
              data:
                value: "turn_on {{ states('input_select.helper_scene_salon')}}"
              target:
                entity_id: input_text.helper_ikea_dimmer_switch_salon
        # ELIF right
        - conditions:
          - condition: trigger
            id: right
          sequence:
            - action: input_select.select_next
              data:
                cycle: true
              target:
                entity_id: input_select.helper_scene_salon
            - action: scene.turn_on
              target:
                entity_id: "{{ states('input_select.helper_scene_salon')}}"
            - action: input_text.set_value
              data:
                value: "turn_on {{ states('input_select.helper_scene_salon')}}"
              target:
                entity_id: input_text.helper_ikea_dimmer_switch_salon


# REGLA: VIGILANCIA DE LA PRESENCIA (2026-10-10)
# Avisa si un iPhone pierde el permiso de ubicación "Siempre" (iOS lo pregunta
# periódicamente y, si se responde "Al usar la app", la presencia se congela),
# o si un device_tracker GPS lleva más de 24 h sin actualizarse.
- id: F13
  alias: 'F13 Family Presence Watchdog'
  mode: queued
  triggers:
    - trigger: state
      entity_id:
        - sensor.iphone_aac_location_permission
        - sensor.iphone_mfc_location_permission
        - sensor.iphone_paf_location_permission
        - sensor.iphone_aaf_location_permission
      not_to:
        - 'Authorized Always'
        - 'unavailable'
        - 'unknown'
      for: '00:05:00'
      id: permiso
    - trigger: time
      at: '12:00:00'
      id: diario
  actions:
    - variables:
        problemas: >-
          {% set ns = namespace(l=[]) %}
          {% for p in ['aac','mfc','paf','aaf'] %}
            {% set perm = states('sensor.iphone_' ~ p ~ '_location_permission') %}
            {% if perm not in ['Authorized Always','unavailable','unknown'] %}
              {% set ns.l = ns.l + ['iPhone ' ~ p|upper ~ ': permiso de ubicación "' ~ perm ~ '" (debe ser Siempre)'] %}
            {% endif %}
            {% set t = states['device_tracker.iphone_' ~ p] %}
            {% if t is not none and (now() - t.last_updated).total_seconds() > 86400 %}
              {% set ns.l = ns.l + ['iPhone ' ~ p|upper ~ ': sin actualizar posición desde ' ~ t.last_updated.astimezone().strftime('%d/%m %H:%M')] %}
            {% endif %}
          {% endfor %}
          {{ ns.l | join('\n') }}
    - condition: template
      value_template: "{{ problemas | length > 0 }}"
    - action: persistent_notification.create
      data:
        notification_id: presence_watchdog
        title: 'Presencia: revisar iPhone'
        message: "{{ problemas }}"
    - action: script.notifica_evento
      data:
        titulo: '*PRESENCIA HOMY*'
        mensaje: "{{ problemas }}"

#-----------------------------------------------------------------------------#
#                                                                             #
# REGLAS DE CONTROL DE ESCENAS                                                #
#                                                                             #
#-----------------------------------------------------------------------------#

- id: E01
  alias: 'E01 Escena Estudio Sunrise al Amanecer'
  mode: restart
  triggers:
    - trigger: state
      entity_id: binary_sensor.aqara_movimiento_estudio
      to: 'on'
  conditions:
    - condition: and
      conditions:
        # Si la fecha de última ejecucion de la escena es diferente a la del día (no se ha ejecutado ese día)
        - condition: template
          value_template: "{{ states('scene.estudio_sunrise') == 'unknown' or 
            states('sensor.date') != (as_timestamp(states('scene.estudio_sunrise')) | timestamp_custom('%Y-%m-%d', True)) }}"
        - condition: sun
          before: sunset
        - condition: sun
          after: sunrise
          after_offset: "-01:00:00"
        - condition: state
          entity_id: binary_sensor.family_home_aac
          state: 'on'
  actions:
    - action: scene.turn_on
      target:
        entity_id: scene.estudio_sunrise
    # Alexa Estudio Cadena COPE
    #
    - action: media_player.media_play
      target:
        entity_id: media_player.echo_alexa_estudio

- id: E02
  alias: 'E02 Escena Estudio Sunset al Atardecer'
  mode: restart
  triggers:
    - trigger: sun
      event: sunset
      offset: "-00:15:00"
  conditions:
    - condition: and
      conditions:
        # Si la fecha de última ejecucion de la escena es diferente a la del día (no se ha ejecutado ese día)
        - condition: template
          value_template: "{{ states('scene.estudio_sunrise') == 'unknown' or 
            states('sensor.date') != (as_timestamp(states('scene.estudio_sunrise')) | timestamp_custom('%Y-%m-%d', True)) }}"
        # Si AAC está en casa
        - condition: state
          entity_id: binary_sensor.family_home_aac
          state: 'on'
        # Algún portátil AAC deben estar encendido
        - condition: state
          entity_id: binary_sensor.laptop_aac
          state: 'on'
  actions:
    - action: scene.turn_on
      target:
        entity_id: scene.estudio_sunrise
    - action: media_player.media_pause
      target:
        entity_id: media_player.echo_alexa_estudio

- id: E03
  alias: 'E03 Escena Estudio Sleep'
  mode: restart
  triggers:
    - trigger: time
      at:
        - "23:00:00"
        - "00:00:00"
        - "01:00:00"
        - "02:00:00"
        - "03:30:00"
        - "04:00:00"
  conditions:
    - condition: and
      conditions:
        # Si la fecha de última ejecucion de la escena es diferente a la del día (no se ha ejecutado ese día)
        - condition: state
          entity_id:
            - cover.persiana_estudio
          state: 'open'
        - condition: template
          value_template: "{{ states('scene.estudio_sleep') == 'unknown' or
            states('sensor.date') != (as_timestamp(states('scene.estudio_sleep')) | timestamp_custom('%Y-%m-%d', True)) }}"
        # Los dos portátiles AAC deben estar apagados
        - condition: state
          entity_id: binary_sensor.laptop_aac
          state: 'off'
  actions:
    - action: scene.turn_on
      target:
        entity_id: scene.estudio_sleep
    - action: media_player.media_pause
      target:
        entity_id: media_player.echo_alexa_estudio



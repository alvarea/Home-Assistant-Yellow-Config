- id: L01
  alias: 'L01 Luces On Exterior Sunset'
  triggers:
      # offset: "+00:30:00"   # Horario Invierno GMT+1
      # offset: "+00:10:00"   # Horario Invierno GMT+1 - Febrero
      # offset: "+00:15:00"   # Horario Verano GMT+2
    - trigger: sun
      event: sunset
      offset: "+00:15:00"
  actions:
    # Encendido Luces Exterior y Jardín
    - action: script.luces_exterior_on
    # Notifica a Familia
    #- service: script.notifica_evento
    #  data:
    #    voz: 'Se ha puesto el sol. Enciendo luces del jardín'
    #    titulo: '*ALUMBRADO*'
    #    mensaje: >
    #      >>> EVENTO: Puesta de Sol hace 15'
    #
    #      >>> LUCES: Alumbrado Exterior On

- id: L02
  alias: 'L02 Luces Off Exterior Medianoche'
  # APAGA LAS LUCES DEL JARDIN SI NO ES VERANO
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: template
      value_template: "{{ states('input_boolean.helper_temporada_verano') == 'on' and states('light.luces_exterior') == 'on' and 
                          (states.input_datetime.helper_hora_apagado_jardin_verano.attributes.timestamp | int | timestamp_custom('%H:%M', False)) 
                           == states('sensor.time')  
                      }}"
      id: trigger_verano
    - trigger: template
      value_template: "{{ states('input_boolean.helper_temporada_verano') == 'off' and states('light.luces_exterior') == 'on' and 
                          (states.input_datetime.helper_hora_apagado_jardin_invierno.attributes.timestamp | int | timestamp_custom('%H:%M', False)) 
                           == states('sensor.time')  
                      }}"
      id: trigger_invierno
  conditions: []
  actions:
    # Apagado Luces Exterior Casa + Luces Jardín
    - action: light.turn_off
      target:
        entity_id: light.luces_exterior
    # Notifica a Familia
    #- service: script.notifica_evento
    #  data:
    #    voz: 'Es  medianoche. Apagando luces Exterior y Jardín'
    #    titulo: '*ALUMBRADO*'
    #    mensaje: >
    #      >>> EVENTO: Es Medianoche
    #
    
    #      >>> LUCES: Apagado Alumbrado Exterior + Jardín
    - delay: 60
- id: L04
  alias: 'L04 Luces On Salon Sunset'
  triggers:
    - trigger: sun
      # offset: "-00:35:00"   # Horario Invierno GMT+1
      # offset: "-00:15:00"   # Horario Verano GMT+2
      event: sunset
      offset: "-00:35:00"
  conditions:
    condition: and
    conditions:
        # Hay alguien en casa
      - condition: state
        entity_id: binary_sensor.family_any_home
        state: 'on'
      - condition: state
        entity_id: light.luces_salon
        state: 'off'
      - condition: numeric_state
        entity_id: sensor.aqara_movimiento_salon_luminosidad
        below: 50
  actions:
    - action: scene.turn_on
      target:
        entity_id: scene.salon_sunset
      data:
        transition: 300
#
# La regla de alumbrado exterior según sensor se simplifica para que se encienda por la noche, siempre que esté oscuro.
# La idea es que por programacion horaria y puesta de sol la regla de encendido en la puesta de sol encienda y mantenga
# encendida las luces hasta al menos las 23.55.
# A partir de esa hora se apagan las luces y entraria a funcionar esta regla,
# de forma que al pasar alguien por la entrada si está oscuro, encienda los faroles exterior.
# Se elimina la notificación Telegram.
#
- id: L05
  alias: 'L05 Luces On Exterior Segun Sensor'
  # v2 (2026-10-05): mismo esquema que L07.
  # - Disparan el Aqara y el IKEA VALLHORN (ZHA, occupancy).
  # - El apagado ya no es un delay fijo: espera a que NINGÚN sensor detecte presencia
  #   y entonces cuenta 5 min.
  # - Cada nuevo movimiento mientras la regla está en marcha reinicia la cuenta (mode: restart).
  # - Se elimina la condición de luminosidad del Aqara: medía la luz del propio farol
  #   (20-22 lx tras encenderse) y bloqueaba los re-disparos. Basta con sol bajo el horizonte.
  # - Si la luz se encendió a mano o por otra regla (la L05 no está en marcha), no la toca.
  mode: restart
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.aqara_movimiento_entrada_exterior
        - binary_sensor.ikea_sensor_movimiento_entrada_exterior
      to: 'on'
  conditions:
    condition: or
    conditions:
      # Caso 1: arranque normal => de noche y luz apagada
      - condition: and
        conditions:
          - condition: state
            entity_id: sun.sun
            state: 'below_horizon'
          - condition: state
            entity_id: light.luz_exterior
            state: 'off'
      # Caso 2: la regla ya está en marcha (luz encendida por L05) => reiniciar la cuenta
      - condition: template
        value_template: "{{ state_attr('automation.l05_luces_on_exterior_segun_sensor', 'current') | int(0) > 0 }}"
  actions:
    # Luz Exterior ON (solo si está apagada)
    - if:
        - condition: state
          entity_id: light.luz_exterior
          state: 'off'
      then:
        - action: light.turn_on
          target:
            entity_id: light.luz_exterior
    # Espera a que ningún sensor detecte presencia (máx. 30 min por seguridad)
    - wait_template: >
        {{ not is_state('binary_sensor.aqara_movimiento_entrada_exterior', 'on')
           and not is_state('binary_sensor.ikea_sensor_movimiento_entrada_exterior', 'on') }}
      timeout: '00:30:00'
      continue_on_timeout: true
    # Espera de 5'
    - delay: '00:05:00'
    # Luz Exterior OFF
    - action: light.turn_off
      target:
        entity_id: light.luz_exterior

- id: L06
  alias: 'L06 Luces Off Before Sunrise'
  triggers:
    - trigger: time
      at:
        - "01:00:00"
        - "02:00:00"
        - "03:30:00"
        - "04:00:00"
        - "05:00:00"
        - "06:00:00"
        - "07:00:00"
  conditions:
    condition: or
    conditions:
      - condition: state
        entity_id: light.luces_planta_alta # Luces Planta Alta
        state: 'on'
      - condition: state
        entity_id: light.luces_planta_baja # Luces Planta Baja
        state: 'on'
      - condition: state
        entity_id: light.luces_jardin # Luces exterior
        state: 'on'
  actions:
    # Apagado Luces Toda la Casa
    - action: light.turn_off
      target:
        entity_id: light.luces_toda_la_casa

- id: L07
  alias: 'L07 Luces On Entrada Según Sensor'
  # v2 (2026-10-04): añade sensor Matter IKEA MYGGSPRAY (occupancy) junto al Aqara.
  # - El apagado ya no es un delay fijo: espera a que NINGÚN sensor de movimiento
  #   detecte presencia y entonces cuenta 1 min (01-07h) o 5 min (resto).
  # - Cada nuevo movimiento/apertura mientras la regla está en marcha reinicia la cuenta (mode: restart).
  # - Luminosidad: basta con que uno de los dos sensores marque < 100 lx (si ambos caen, se considera oscuro).
  # - Si la luz se encendió a mano (la regla no está en marcha), no la toca, igual que antes.
  mode: restart
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.aqara_movimiento_entrada
        - binary_sensor.ikea_movimiento_entrada
        - binary_sensor.aqara_puerta_entrada_principal
      to: 'on'
  conditions:
    condition: or
    conditions:
      # Caso 1: arranque normal => luz apagada, franja horaria y poca luz
      - condition: and
        conditions:
          - condition: state
            entity_id: light.luz_entrada
            state: 'off'
          - condition: template
            value_template: "{{ now().hour < 11 or now().hour >= 18 }}"
          - condition: template
            value_template: >
              {% set lux = [states('sensor.aqara_movimiento_entrada_luminosidad'),
                            states('sensor.ikea_movimiento_entrada_iluminacion')]
                           | select('is_number') | map('float') | list %}
              {{ lux | count == 0 or lux | min < 100 }}
      # Caso 2: la regla ya está en marcha (luz encendida por L07) => reiniciar la cuenta
      - condition: template
        value_template: "{{ state_attr('automation.l07_luces_on_entrada_segun_sensor', 'current') | int(0) > 0 }}"
  actions:
    # Luces Entrada ON (solo si está apagada)
    - if:
        - condition: state
          entity_id: light.luz_entrada
          state: 'off'
      then:
        - action: light.turn_on
          data:
            brightness_pct: >
              {% if now().hour <= 7 %} 10
              {% else %} 80
              {% endif %}
          target:
            entity_id: light.luz_entrada
    # Espera a que ningún sensor de movimiento detecte presencia (máx. 30 min por seguridad)
    - wait_template: >
        {{ not is_state('binary_sensor.aqara_movimiento_entrada', 'on')
           and not is_state('binary_sensor.ikea_movimiento_entrada', 'on') }}
      timeout: '00:30:00'
      continue_on_timeout: true
    # Espera de x minutos en función de la hora
    - delay:
        minutes: >
          {% if now().hour >= 1 and now().hour <= 7 %} 1
          {% else %} 5
          {% endif %}
    # Luces Entrada OFF (2026-10-12: el LED del tag reader lo gestiona Alarm HOMY)
    - action: light.turn_off
      target:
        entity_id: light.luz_entrada

- id: L08
  alias: 'L08 Luces On Dormitorio Según Sensor'
  mode: restart
  triggers:
    - trigger: state
      entity_id: binary_sensor.aqara_movimiento_principal
      to: 'on'
  conditions:
    condition: and
    conditions:
      - condition: sun
        after: sunset
        after_offset: "+00:30:00"
      - condition: template
        value_template: "{{ (now().hour >= 17 and now().hour <= 22) }}"
      - condition: state
        entity_id: light.luces_dormitorio_mfc
        state: 'off'
      #- condition: sun
      #  # before_offset: "+02:00:00"  ==> Horario Invierno GMT+1, en el amanecer -2h
      #  # before_offset: "+00:30:00" ==> Horario Verano GMT+2, el amanecer -30m
      #  before: sunrise
      #  before_offset: "+02:00:00" # Horario Invierno GMT+1, en el amanecer +60m
  actions:
    - action: light.turn_on
      target:
        entity_id: 
          - light.luces_dormitorio_mfc
          - light.esphome_s20_sw3_led
    - action: input_text.set_value
      data:
        value: "sensor turn_on light.luces_dormitorio"
      target:
        entity_id: input_text.helper_hue_dimmer_switch_dormitorio
    # Espera de 5'
    - delay: '00:10:00'
    # Luces Off + Led
    - action: light.turn_off
      target:
        entity_id: 
          - light.luces_dormitorio_mfc
          - light.esphome_s20_sw3_led
    - action: input_text.set_value
      data:
        value: "sensor turn_off light.luces_dormitorio_mfc"
      target:
        entity_id: input_text.helper_hue_dimmer_switch_dormitorio

- id: L09
  alias: 'L09 Luces On Pasillo Según Sensor'
  # v2 (2026-10-04): añade sensor Matter IKEA MYGGSPRAY de la entrada junto al Hue del pasillo.
  # - El apagado ya no es un delay fijo: espera a que NINGÚN sensor detecte presencia
  #   y entonces cuenta 1 min (01-07h) o 3 min (resto).
  # - Cada nuevo movimiento mientras la regla está en marcha reinicia la cuenta (mode: restart).
  # - Luminosidad: solo la del Hue del pasillo (< 4 lx); si el Hue no da lectura, se considera oscuro.
  # - Si la luz se encendió a mano (la regla no está en marcha), no la toca, igual que antes.
  mode: restart
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.hue_movimiento_pasillo_presencia
        - binary_sensor.ikea_movimiento_entrada
      to: 'on'
  conditions:
    condition: or
    conditions:
      # Caso 1: arranque normal => luz apagada, franja horaria y poca luz
      - condition: and
        conditions:
          #  # after_offset: "-02:00:00"  ==> Horario Invierno GMT+1, en el amanecer -2h
          #  # after_offset: "-00:30:00" ==> Horario Verano GMT+2, el amanecer -30m
          #- condition: sun
          #  after: sunset
          #  after_offset: "-02:00:00"
          - condition: template
            value_template: "{{ now().hour < 11 or now().hour >= 18 }}"
          - condition: template
            value_template: >
              {% set lux = states('sensor.hue_movimiento_pasillo_luminosidad') %}
              {{ not is_number(lux) or lux | float < 4 }}
          - condition: state
            entity_id: light.luz_pasillo
            state: 'off'
      # Caso 2: la regla ya está en marcha (luz encendida por L09) => reiniciar la cuenta
      - condition: template
        value_template: "{{ state_attr('automation.l09_luces_on_pasillo_segun_sensor', 'current') | int(0) > 0 }}"
  actions:
    # Luces Pasillo ON (solo si está apagada)
    - if:
        - condition: state
          entity_id: light.luz_pasillo
          state: 'off'
      then:
        - action: light.turn_on
          data:
            brightness_pct: >
              {% if now().hour >= 0 and now().hour <= 7 %} 10
              {% elif now().hour >= 8 and now().hour <= 17 %} 40
              {% else %} 50
              {% endif %}
          target:
            entity_id: light.luz_pasillo
    # Espera a que ningún sensor detecte presencia (máx. 30 min por seguridad)
    - wait_template: >
        {{ not is_state('binary_sensor.hue_movimiento_pasillo_presencia', 'on')
           and not is_state('binary_sensor.ikea_movimiento_entrada', 'on') }}
      timeout: '00:30:00'
      continue_on_timeout: true
    # Espera de x minutos en función de la hora
    - delay:
        minutes: >
          {% if now().hour >= 1 and now().hour <= 7 %} 1
          {% else %} 3
          {% endif %}
    # Luces Off
    - action: light.turn_off
      target:
        entity_id:
          - light.luz_pasillo

- id: L10
  alias: 'L10 Luces On Estudio Según Sensor'
  mode: restart
  triggers:
    - trigger: state
      entity_id: binary_sensor.aqara_movimiento_estudio
      to: 'on'
  conditions:
    - condition: state
      entity_id: light.luz_estudio
      state: 'off'
    - condition: or
      conditions:
        - condition: sun
          after: sunset
          after_offset: "+00:30:00"
        - condition: sun
          # before_offset: "+00:30:00"  ==> Horario Invierno GMT+1, en el amanecer -30m
          # before_offset: "+01:30:00" ==> Horario Verano GMT+2, el amanecer 1h-30m
          before: sunrise
          before_offset: "+00:30:00"
        # https://www.home-assistant.io/docs/scripts/conditions/
        #
        # si el sensor de luz está es < 3 lumx
        #- condition: numeric_state
        #  entity_id: sensor.illumination_158d0001e464a6
        #  below: 2
        # 'when dark' condition: either after sunset or before sunrise
  actions:
    # Luces On
    - action: light.turn_on
      target:
        entity_id:
          - light.luz_estudio_techo
    #- service: scene.turn_on
    #  target:
    #    entity_id: scene.estudio_hall
    #  data:
    #    transition: 3
    # Espera de 5'
    - delay:
        minutes: >
          {% if now().hour >= 1 and now().hour <= 7 %} 1
          {% else %} 5
          {% endif %}
    # Luces Off + Led
    - action: light.turn_off
      target:
        entity_id: 
          - light.luz_estudio_techo

- id: L11
  alias: 'L11 Luces On Armario Estudio Sensor'
  mode: restart
  triggers:
    - trigger: state
      entity_id: binary_sensor.aqara_puerta_estudio_armario
  actions:
    - choose:
      # IF puerta cerrada => apaga Luz siempre
      - conditions:
        - condition: state
          entity_id: binary_sensor.aqara_puerta_estudio_armario
          state: 'off' # CERRADO
        sequence:
          - action: light.turn_off
            target:
              entity_id: 
                - light.luz_estudio_armario
                - light.esphome_s26_sw1_led
      #ELSE puerta abierta
      default:
        - action: light.turn_on
          target:
            entity_id: 
              - light.luz_estudio_armario
              - light.esphome_s26_sw1_led

- id: L12
  alias: 'L12 Luces On Cocina Según Sensor'
  description: >-
    Enciende la cocina al 50 % con movimiento desde 30 min antes de la puesta de sol
    hasta 30 min después del amanecer (cruza medianoche). Apaga a los 2 min (1-7 h)
    o 10 min. 2026-10-16: corregido sun 'after: sunset' (falso tras las 00:00) y
    quitado el template de horas (bloqueaba 17:30-19:00 en invierno).
  mode: restart
  triggers:
    - trigger: state
      entity_id: binary_sensor.ikea_sensor_movimiento_cocina
      to: 'on'
  conditions:
    - condition: sun
      after: sunset
      after_offset: "-00:30:00"
      before: sunrise
      before_offset: "00:30:00"
    - condition: state
      entity_id: light.luces_cocina
      state: 'off'
  actions:
    - action: light.turn_on
      data:
        brightness_pct: 50
      target:
        entity_id: light.luces_cocina
    - delay:
        minutes: "{{ 2 if 1 <= now().hour <= 7 else 10 }}"
    - action: light.turn_off
      target:
        entity_id: light.luces_cocina



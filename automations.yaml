  alias: ZMA Dormitorio IKEA BILRESA Boton Doble
  mode: single
  # IKEA BILRESA dual button (Matter/Thread): event.bilresa_dual_button_button_1 / _2
  # Eventos: multi_press_1, multi_press_2, long_press, long_release
  #   larga (cualquier botón) → PÁNICO SONORO   [Alarm HOMY] (2026-10-12: antes silencioso)
  #   Al enrolar los BILRESA #2 y #3 (MAT-03): añadir aquí sus event.*_button_1/_2 (misma regla)
  triggers:
    - trigger: state
      entity_id:
        - event.bilresa_dual_button_button_1
        - event.bilresa_dual_button_button_2
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.from_state is not none and trigger.from_state.state not in ['unavailable', 'unknown']
           and trigger.to_state.attributes.event_type == 'long_press' }}
  actions:
    - action: script.alarm_homy_panico
      data:
        tipo: panico_sonoro
        origen: "BILRESA botón {{ '1' if trigger.entity_id.endswith('_1') else '2' }}"

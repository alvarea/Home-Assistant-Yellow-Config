# Comprueba si el Tag Reader tiene apagado el led verde y sonido cuando lee un tag, para activarlo siempre.
- id: t00_tagreader_turn_on_led
  alias: 'Tagreader Turn On Led'
  triggers:
    - trigger: state
      entity_id: switch.tagreader_9a0be4_buzzer_enabled
      to: 'off'
    - trigger: state
      entity_id: switch.tagreader_9a0be4_led_enabled
      to: 'off'
  actions:
    - action: switch.turn_on
      data:
        entity_id: 
          - switch.tagreader_9a0be4_buzzer_enabled
          - switch.tagreader_9a0be4_led_enabled

- id: t01_nfc_tags_alarm_toogle
  alias: 'NFC Tags Alarm Toogle'
  # 2026-10-12 Alarm HOMY: desarmada → arma Ausente; cualquier otro estado → desarma.
  mode: single
  triggers:
    - trigger: tag
      tag_id: 04-50-B6-01-25-3B-03 # AAC Blue Tag
      id: Agustín
    - trigger: tag
      tag_id: 04-50-4F-01-B5-1D-03 # MFC Red Tag
      id: Malen
    - trigger: tag
      tag_id: 04-50-9A-01-7D-1D-03 # AAF Black Tag
      id: Agu
    - trigger: tag
      tag_id: 04-50-B3-01-0D-3B-03 # PAF Yellow Tag
      id: Paloma
  actions:
    - if:
        - condition: state
          entity_id: alarm_control_panel.alarm_homy
          state: 'disarmed'
      then:
        - action: script.alarm_homy_armar
          data:
            modo: armed_away
            origen: "{{ trigger.id }} (NFC)"
      else:
        - action: script.alarm_homy_desarmar
          data:
            validar: false
            origen: "{{ trigger.id }} (NFC)"

- id: t02_nfc_tags_credit_card_boton_panico
  alias: 'NFC Tags Credit Card Botón Pánico'
  triggers:
    - trigger: tag
      tag_id: 79-D5-0A-8F # Tag Credit Card
  actions:
    # 2026-10-12 Alarm HOMY: pánico sonoro
    - action: script.alarm_homy_panico
      data:
        tipo: panico_sonoro
        origen: Tarjeta NFC

- id: t03_nfc_tags_bigblue_alarm_armed_away'
  alias: 'NFC Tags Big Blue  - Armado Away'
  triggers:
    - trigger: tag
      tag_id: 2C-CA-F0-22
  actions:
    # 2026-10-12 Alarm HOMY
    - action: script.alarm_homy_armar
      data:
        modo: armed_away
        origen: Big Blue (NFC)



#  alias: ZHA Dormitorio AAC IKEA Somrig
#  ALA-43 (2026-10-29): B1 luces; B2 desarmado urgente en 2 pasos (corta abre ventana de 10 s
#  con aviso de voz, larga confirma). Solo en Casa/Noche (incluye pending/triggered). La ventana es
#  timer.alarm_homy_mando_dormitorio (helper UI, sin restore: tras reiniciar HA queda cerrada).
- id: ZHA_L11
  alias: ZHA Dormitorio AAC IKEA Somrig
  mode: restart
  #
  # Event Type: remote_button_short_press, remote_button_double_press, remote_button_long_press
  # Event Subtype: button_1,button_2
  #
  triggers:
    - device_id: 3669ebbfa7c0575345aa83a9121ba51b
      domain: zha
      trigger: device
      type: remote_button_short_press
      subtype: button_1
      id: b1_short_press # Trigger ID
    - device_id: 3669ebbfa7c0575345aa83a9121ba51b
      domain: zha
      trigger: device
      type: remote_button_double_press
      subtype: button_1
      id: b1_double_press
    - device_id: 3669ebbfa7c0575345aa83a9121ba51b
      domain: zha
      trigger: device
      type: remote_button_long_press
      subtype: button_1
      id: b1_long_press
    - device_id: 3669ebbfa7c0575345aa83a9121ba51b
      domain: zha
      trigger: device
      type: remote_button_short_press
      subtype: button_2
      id: b2_short_press
    - device_id: 3669ebbfa7c0575345aa83a9121ba51b
      domain: zha
      trigger: device
      type: remote_button_long_press
      subtype: button_2
      id: b2_long_press
  conditions: []
  actions:
    - variables:
        # Desarmado desde el mando solo en Casa/Noche; el modo se mantiene en pending/triggered
        desarme_permitido: >-
          {{ states('input_select.alarm_homy_modo') in ['armed_home', 'armed_night']
             and not is_state('input_select.alarm_homy_estado', 'disarmed') }}
    - choose:
        # IF b1_short_press
        - conditions:
          - condition: trigger
            id: b1_short_press
          sequence:
            - action: light.toggle
              target:
                entity_id: light.luz_dormitorio_agustin
        # ELIF b1_double_press
        - conditions:
          - condition: trigger
            id: b1_double_press
          sequence:
            - action: light.toggle
              target:
                entity_id: light.luz_dormitorio_malen
        # ELIF b1_long_press: entrada + pasillo juntas (si alguna está encendida, apaga ambas)
        - conditions:
          - condition: trigger
            id: b1_long_press
          sequence:
            - action: "light.turn_{{ 'off' if is_state('light.luz_entrada', 'on') or is_state('light.luz_pasillo', 'on') else 'on' }}"
              target:
                entity_id: [light.luz_entrada, light.luz_pasillo]
        # ELIF b2_short_press: abre la ventana de 10 s (si ya está abierta, se ignora)
        - conditions:
          - condition: trigger
            id: b2_short_press
          - condition: template
            value_template: "{{ desarme_permitido }}"
          - condition: state
            entity_id: timer.alarm_homy_mando_dormitorio
            state: idle
          sequence:
            - action: timer.start
              target:
                entity_id: timer.alarm_homy_mando_dormitorio
              data:
                duration: "00:00:10"
            - action: script.turn_on
              target:
                entity_id: script.alexa_decir
              data:
                variables:
                  echos: [dormitorio]
                  tipo: anuncio
                  mensaje: Mantén pulsado para desarmar.
        # ELIF b2_long_press: confirma dentro de la ventana
        - conditions:
          - condition: trigger
            id: b2_long_press
          - condition: template
            value_template: "{{ desarme_permitido }}"
          - condition: state
            entity_id: timer.alarm_homy_mando_dormitorio
            state: active
          sequence:
            - action: timer.cancel
              target:
                entity_id: timer.alarm_homy_mando_dormitorio
            - action: script.alarm_homy_desarmar
              data:
                validar: false
                origen: Mando dormitorio


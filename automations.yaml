- id: hass_weekly_ha_restart
  alias: 'HA weekly restart'
  triggers:
    - trigger: time
      at: '06:00:00'
  conditions:
    - condition: time
      weekday: sat
  actions:
    # Reinicio HA Core
    - action: homeassistant.restart

- id: hass_daily_automations
  alias: 'HA daily automations'
  triggers:
    - trigger: time
      at:
        - '09:00:00'
        - '22:30:00'
  actions:
    # Volumen base de cada Echo = su volumen de "anuncio" de día (09:00) o de noche (22:30)
    # (2026-10-12: sustituye a script.alexa_<echo>_set_volumen; tablas en input_number.alexa_<echo>_volumen_*)
    - repeat:
        for_each: [entrada, estudio, dormitorio, dormitorio_paf]
        sequence:
          - action: media_player.volume_set
            continue_on_error: true
            target: {entity_id: "media_player.echo_alexa_{{ repeat.item }}"}
            data:
              volume_level: "{{ states('input_number.alexa_' ~ repeat.item ~ '_volumen_anuncio_' ~ ('dia' if now().hour < 12 else 'noc')) | float(0.3) }}"

- id: hass_clock_notify
  alias: 'HASS Clock Notify'
  triggers:
    - trigger: time
      at:
        - '13:00:00'
        - '13:45:00'
        - '14:30:00'
        - '21:30:00'
        - '22:00:00'
  actions:
    # Voz + campanilla en el Echo de la entrada (2026-10-12: script.alexa_decir)
    - action: script.alexa_decir
      data:
        echos: [entrada]
        sonido: clock_01
        repeticiones: 1
        tipo: anuncio
        mensaje: >-
          {% set h, m = now().hour, now().minute %}
          {% if h == 13 and m == 0 %}Buenos días. Son las {{ h }}, es la hora de un aperitivo.
          {% elif h == 13 and m == 45 %}Buenas tardes. Son las {{ h }} y {{ m }}, es la hora de preparar la comida.
          {% elif h == 14 and m == 30 %}Buenas tardes. Son las {{ h }} y {{ m }}, es la hora del almuerzo.
          {% elif h == 21 %}Buenas noches. Son las {{ h }} y {{ m }}, es la hora de preparar la cena.
          {% elif h == 22 %}Buenas noches. Son las {{ h }}, bajo volumen de la entrada a modo noche.
          {% endif %}

- id: hass_blink_update
  alias: 'BLINK Camera Update'
  triggers:
    - trigger: time_pattern
      hours: "/1"
  conditions:
    condition: and
    conditions:
      - condition: template
        value_template: "{{ (now().hour >= 6 and now().hour <=23) or (now().hour >= 0 and now().hour <= 1) }}"
      - condition: state
        entity_id: input_boolean.helper_blink_camera_trigger
        state: 'on'
  actions:
    - action: script.trigger_blink_hall
    - delay: '00:00:05'
    - action: script.trigger_blink_puerta_principal
    - delay: '00:00:05'
    - action: script.trigger_blink_cancela_left
    - delay: '00:00:05'
    - action: script.trigger_blink_cancela_right
    - delay: '00:00:05'
    - action: script.trigger_blink_piscina
    - delay: '00:00:05'
    - action: script.trigger_blink_porche
    - delay: '00:00:05'
    - action: script.trigger_blink_estudio
    - delay: '00:00:05'
    - action: script.trigger_blink_salon
    - delay: '00:00:05'
    - action: script.trigger_blink_cocina

 
- id: wallpanel_ipad_battery
  alias: 'IPAD Battery Check'
  description: >-
    Cargador iPad WallPanel (switch.esphome_mini_sw4). Carga si <= 25 %, nivel desconocido
    o > 6 h sin reportar con < 60 %. Corta a 95 %, Full o Not Charging >= 80 %.
    Evalua el estado completo (no cruces de umbral): cambios del iPad, cada 15 min,
    arranque de HA y vuelta del ESP tras reinicio. Revisado 2026-10-13.
  mode: queued
  max: 3
  triggers:
    - trigger: state
      entity_id:
        - sensor.ipad_battery_level
        - sensor.ipad_battery_state
    - trigger: state
      entity_id: switch.esphome_mini_sw4
      from: unavailable
    - trigger: time_pattern
      minutes: /15
    - trigger: homeassistant
      event: start
  variables:
    nivel: "{{ states('sensor.ipad_battery_level') | int(-1) }}"
    estado: "{{ states('sensor.ipad_battery_state') }}"
    horas_sin_dato: >-
      {% set s = states.sensor.ipad_battery_level %}
      {{ ((now() - s.last_reported).total_seconds() / 3600) | round(1) if s else 99 }}
    cargar: "{{ nivel < 0 or nivel <= 25 or (horas_sin_dato > 6 and nivel < 60) }}"
    parar: >-
      {{ not cargar and (nivel >= 95 or estado == 'Full'
         or (estado == 'Not Charging' and nivel >= 80)) }}
  conditions:
    - condition: template
      value_template: "{{ states('switch.esphome_mini_sw4') in ['on', 'off'] }}"
  actions:
    - choose:
        - conditions: "{{ cargar and is_state('switch.esphome_mini_sw4', 'off') }}"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.esphome_mini_sw4
        - conditions: "{{ parar and is_state('switch.esphome_mini_sw4', 'on') }}"
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.esphome_mini_sw4





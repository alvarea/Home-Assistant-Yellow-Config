#
# ALARMA AUTOMATICA SENSOR HUMO COCINA
#
- id: X1_alarma_humo_cocina
  alias: 'X1 Alarma Humo Cocina'
  triggers:
    - trigger: state
      entity_id: binary_sensor.aqara_humo_cocina
      from: 'off'
      to: 'on'
  actions:
    # Micro Aviso Sirena Interior
    - action: script.sirena_alarma_micro_aviso

    # Voz + sonido en el Echo de la entrada (2026-10-12: script.alexa_decir, volumen de alarma)
    - action: script.turn_on        # sin esperar: el aviso iOS sale a la vez
      target: {entity_id: script.alexa_decir}
      data:
        variables:
          echos: [entrada]
          mensaje: 'ATENCION! ¡ALARMA HUMO COCINA!. Sensor Humo Cocina. ¡ATENCION! ¡ALARMA!'
          sonido: "{{ states('input_select.alarma_sonido_disparado') }}"
          repeticiones: 1
          tipo: alarma

    # Aviso (2026-10-12: script.notifica; corrige el antiguo data.variables que llegaba vacío)
    - action: script.notifica
      data:
        titulo: '*ATENCION ALARMA HUMO*'
        mensaje: '>>> URGENTE: SENSOR HUMO COCINA'
        nivel: critico
        destinos: todos
        telegram: alarm
        persistente: true

#
# SCRIPTS PARA GESTION ALARMA DESDE ALEXA
#
# 2026-10-12: scripts llamados por las rutinas de Alexa → motor Alarm HOMY
homy_armado_parcial:
  alias: 'Homy Armado Parcial'
  sequence:
    - condition: state
      entity_id: alarm_control_panel.alarm_homy
      state: 'disarmed'
    - action: script.alarm_homy_armar
      data:
        modo: armed_home
        origen: Alexa

homy_armado_total:
  alias: 'Homy Armado Total'
  sequence:
    - condition: state
      entity_id: alarm_control_panel.alarm_homy
      state: 'disarmed'
    - action: script.alarm_homy_armar
      data:
        modo: armed_away
        origen: Alexa

homy_desarmado_code:
  alias: 'Homy Desarmado'
  sequence:
    - action: script.alarm_homy_desarmar
      data:
        validar: false
        origen: Alexa


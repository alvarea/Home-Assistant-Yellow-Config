        {% else %} mdi:motion-sensor-off
        {% endif %}

    - name: alarma_sensor_movimiento_cocina
      unique_id: alarma_sensor_movimiento_cocina
      state: >-
        {%  if is_state('input_boolean.control_alarma_sensor_presencia_cocina','on')

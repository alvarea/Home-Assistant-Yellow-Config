        {%  if is_state('input_boolean.control_alarma_sensor_presencia_dormitorio_principal','on')
            and is_state('binary_sensor.aqara_movimiento_principal','on')
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.alarma_sensor_movimiento_dormitorio_principal','on') %} mdi:motion-sensor
        {% else %} mdi:motion-sensor-off
        {% endif %}

    - name: alarma_sensor_movimiento_pasillo
      unique_id: alarma_sensor_movimiento_pasillo
      state: >-
        {%  if is_state('input_boolean.control_alarma_sensor_presencia_pasillo','on')

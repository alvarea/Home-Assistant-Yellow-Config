        %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.alarma_sensor_movimiento_blink_salon','on') %} mdi:motion-sensor
        {% else %} mdi:motion-sensor-off
        {% endif %}

    - name: alarma_sensor_movimiento_blink_cancela_left
      unique_id: alarma_sensor_movimiento_blink_cancela_left
      state: >-
        {%  if is_state('binary_sensor.blink_cancela_left_camera_armed','on')

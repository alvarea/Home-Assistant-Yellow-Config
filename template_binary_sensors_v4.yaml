# ============================================================
# BINARY SENSOR TEMPLATES - MIGRACIÓN DEFINITIVA
# Formato moderno requerido desde HA 2026.6
# ============================================================
#
# IMPORTANTE: name = snake_case original => entity_id preservado
#   entity_id generado = binary_sensor.<name>
#   Esto garantiza compatibilidad con todas las automatizaciones
#   y dashboards existentes que usan los entity_ids originales.
#
# El friendly_name original (si existía) queda como comentario
# de referencia. Para mostrarlo en la UI, cámbialo desde
# Configuración -> Entidades -> <sensor> -> lápiz editar.
#
# INSTRUCCIONES:
#   Añade el bloque '- binary_sensor:' al template.yaml existente.
#   NO puede haber más de una sección 'template:' en configuration.yaml.

template:

  - binary_sensor:

    # ------------------------------------------------------------
    # CONTROL ALARMA
    # ------------------------------------------------------------
    - name: alarma_estado_general
      unique_id: alarma_estado_general
      state: >-
        {%  if is_state('alarm_control_panel.ha','disarmed')
            and is_state('alarm_control_panel.blink_casa','disarmed')
        %}
          false
        {% else %}
          true
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.alarma_estado_armado','on') %} mdi:alarm-light
        {% else %} mdi:alarm-light-off
        {% endif %}

    - name: alarma_check_listo_para_armar
      unique_id: alarma_check_listo_para_armar
      state: >-
        {%  if is_state('binary_sensor.alarma_sensores_perimetro_principal','off')
            and is_state('binary_sensor.aqara_humo_cocina','off')
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.alarma_check_listo_para_armar','on') %} mdi:alarm-light
        {% else %} mdi:alarm-light-off
        {% endif %}

    # ------------------------------------------------------------
    # SENSORES PRESENCIA INTERIOR (ALARMA)
    # ------------------------------------------------------------
    - name: alarma_sensor_movimiento_salon
      unique_id: alarma_sensor_movimiento_salon
      state: >-
        {%  if is_state('input_boolean.control_alarma_sensor_presencia_salon','on')
            and is_state('binary_sensor.aqara_movimiento_salon','on')
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.alarma_sensor_presencia_salon','on') %} mdi:motion-sensor
        {% else %} mdi:motion-sensor-off
        {% endif %}

    - name: alarma_sensor_movimiento_estudio
      unique_id: alarma_sensor_movimiento_estudio
      state: >-
        {%  if is_state('input_boolean.control_alarma_sensor_presencia_estudio','on')
            and is_state('binary_sensor.aqara_movimiento_estudio','on')
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.alarma_sensor_presencia_estudio','on') %} mdi:motion-sensor
        {% else %} mdi:motion-sensor-off
        {% endif %}

    - name: alarma_sensor_movimiento_entrada_hall
      unique_id: alarma_sensor_movimiento_entrada_hall
      state: >-
        {%  if is_state('input_boolean.control_alarma_sensor_presencia_entrada_hall','on')
            and is_state('binary_sensor.aqara_movimiento_entrada','on')
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.alarma_sensor_presencia_entrada_hall','on') %} mdi:motion-sensor
        {% else %} mdi:motion-sensor-off
        {% endif %}

    - name: alarma_sensor_movimiento_dormitorio_principal

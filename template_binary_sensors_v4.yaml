        {% endif %}

    - name: riego_bomba_pozo_status
      unique_id: riego_bomba_pozo_status
      state: >-
        {% if is_state('switch.esphome_pow_sw4','on') %}
          true
        {% else %}
          false
        {% endif %}
      icon: mdi:water-well
      # friendly_name (referencia): 'Control Bomba Riego'

    - name: riego_bomba_pozo_motor_on
      unique_id: riego_bomba_pozo_motor_on
      state: >-
        {%  if states('sensor.esphome_pow_sw4_voltage')|int(0) > 200
            and states('sensor.esphome_pow_sw4_power')|round(1) > 100
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: mdi:flash-outline

    - name: riego_bomba_pozo_warning_motor_off
      unique_id: riego_bomba_pozo_warning_motor_off
      state: >-
        {% if (is_state('binary_sensor.riego_cesped_ch1_status','on') or
               is_state('binary_sensor.riego_cesped_ch2_status','on') or
               is_state('binary_sensor.riego_cesped_ch3_status','on')
              ) and states('sensor.esphome_pow_sw4_power')|round(1) < 100
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: mdi:flash-alert

    - name: riego_bomba_pozo_warning_consumo
      unique_id: riego_bomba_pozo_warning_consumo
      state: >-
        {%  if states('sensor.esphome_pow_sw4_voltage')|int(0) > 200
            and states('sensor.esphome_pow_sw4_power')|round(1) > 1800
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: mdi:flash-alert

    # ------------------------------------------------------------
    # AEMET PREVISION METEOROLOGICA
    # ------------------------------------------------------------
    - name: aemet_prevision_lluvia_0d
      unique_id: aemet_prevision_lluvia_0d
      state: >-
        {% if (is_state('sensor.aemet_icono_0d','rainy') or
               is_state('sensor.aemet_icono_0d','snow') or
               is_state('sensor.aemet_icono_0d','sleet')
              ) and states('sensor.aemet_lluvia_0d')|int(0)>=80
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.aemet_prevision_lluvia_0d','on') %} mdi:weather-rainy
        {% else %} mdi:weather-sunny
        {% endif %}
      # friendly_name (referencia): 'Pronóstico Lluvia 0d'

    - name: aemet_prevision_lluvia_1d
      unique_id: aemet_prevision_lluvia_1d
      state: >-
        {% if (is_state('sensor.aemet_icono_1d','rainy') or
               is_state('sensor.aemet_icono_1d','snow') or
               is_state('sensor.aemet_icono_1d','sleet')
              ) and states('sensor.aemet_lluvia_1d')|int(0)>=80
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.aemet_prevision_lluvia_1d','on') %} mdi:weather-rainy
        {% else %} mdi:weather-sunny
        {% endif %}
      # friendly_name (referencia): 'Pronóstico Lluvia +1d'

    - name: aemet_prevision_lluvia_2d
      unique_id: aemet_prevision_lluvia_2d
      state: >-

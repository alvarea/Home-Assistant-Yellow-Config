        %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.alarma_sensor_movimiento_cocina','on') %} mdi:motion-sensor
        {% else %} mdi:motion-sensor-off
        {% endif %}

    # ------------------------------------------------------------

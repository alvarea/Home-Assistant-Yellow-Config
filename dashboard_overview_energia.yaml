###############################################################################
#  Vista "Energía" del dashboard Overview (/lovelace/energia)
#  ENE-06 · coste hoy / mes, valle frente a punta/llano y coste del coche (2026-10-21).
#  Package: packages/energia.yaml · Backlog: claude/backlog-ene.md
#  Solo tarjetas nativas. Sin exportar todavía desde el storage de HA.
#  Restaurar: Overview → Editar → ⋮ Editor de configuración en bruto → pegar
#             como un elemento más de "views:".
###############################################################################
title: Energía
path: energia
icon: mdi:flash
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: heading
        heading: Coste general (casa + coche)
        icon: mdi:home-lightning-bolt
        heading_style: title
        badges:
          - type: entity
            entity: sensor.precio_luz_actual
            show_state: true
            show_icon: true
      - type: tile
        entity: sensor.coste_general_hoy
        name: Hoy
        icon: mdi:calendar-today
        vertical: true
      - type: tile
        entity: sensor.coste_general_mes
        name: Este mes
        icon: mdi:calendar-month
        vertical: true
      - type: entities
        title: Valle frente a punta/llano
        show_header_toggle: false
        entities:
          - type: section
            label: Hoy
          - entity: sensor.coste_general_hoy_valle
            name: Coste valle
          - entity: sensor.coste_general_hoy_punta_llano
            name: Coste punta/llano
          - entity: sensor.general_energia_red_diario_valle
            name: kWh valle
          - entity: sensor.general_energia_red_diario_punta_llano
            name: kWh punta/llano
          - type: section
            label: Mes
          - entity: sensor.coste_general_mes_valle
            name: Coste valle
          - entity: sensor.coste_general_mes_punta_llano
            name: Coste punta/llano
          - entity: sensor.general_energia_red_mensual_valle
            name: kWh valle
          - entity: sensor.general_energia_red_mensual_punta_llano
            name: kWh punta/llano
  - type: grid
    cards:
      - type: heading
        heading: Coche (Trydan)
        icon: mdi:ev-station
        heading_style: title
      - type: tile
        entity: sensor.coste_ve_hoy
        name: Hoy
        icon: mdi:calendar-today
        vertical: true
      - type: tile
        entity: sensor.coste_ve_mes
        name: Este mes
        icon: mdi:calendar-month
        vertical: true
      - type: entities
        title: Carga por periodo
        show_header_toggle: false
        entities:
          - type: section
            label: Hoy
          - entity: sensor.ve_energia_diario_valle
            name: kWh valle
          - entity: sensor.ve_energia_diario_punta_llano
            name: kWh punta/llano
          - entity: sensor.coste_ve_hoy_valle
            name: Coste valle
          - entity: sensor.coste_ve_hoy_punta_llano
            name: Coste punta/llano
          - type: section
            label: Mes
          - entity: sensor.ve_energia_mensual_valle
            name: kWh valle
          - entity: sensor.ve_energia_mensual_punta_llano
            name: kWh punta/llano
          - entity: sensor.coste_ve_mes_valle
            name: Coste valle
          - entity: sensor.coste_ve_mes_punta_llano
            name: Coste punta/llano
  - type: grid
    cards:
      - type: heading
        heading: Potencia
        icon: mdi:flash-triangle
        heading_style: title
      - type: tile
        entity: sensor.v2c_house_power
        name: Consumo general
        vertical: true
      - type: tile
        entity: sensor.casa_potencia
        name: Consumo casa (sin coche)
        vertical: true
      - type: tile
        entity: sensor.potencia_contratada_actual
        name: Límite vigente
        vertical: true
      - type: history-graph
        title: Consumo frente al límite (24 h)
        hours_to_show: 24
        entities:
          - entity: sensor.v2c_house_power
            name: General
          - entity: sensor.casa_potencia
            name: Casa
          - entity: sensor.v2c_charge_power
            name: Coche
          - entity: sensor.potencia_contratada_actual
            name: Límite
        grid_options:
          columns: 12

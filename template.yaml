        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.alarma_sensor_movimiento_blink_cancela_right','on') %} mdi:motion-sensor
        {% else %} mdi:motion-sensor-off
        {% endif %}

    - name: alarma_sensor_movimiento_blink_puerta_principal
      unique_id: alarma_sensor_movimiento_blink_puerta_principal
      state: >-
        {%  if is_state('binary_sensor.blink_puerta_principal_camera_armed','on')

        %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.alarma_sensor_movimiento_blink_puerta_principal','on') %} mdi:motion-sensor
        {% else %} mdi:motion-sensor-off
        {% endif %}

    - name: alarma_sensor_movimiento_blink_piscina
      unique_id: alarma_sensor_movimiento_blink_piscina
      state: >-
        {%  if is_state('binary_sensor.blink_piscina_camera_armed','on')
            and is_state('binary_sensor.blink_piscina_motion_detected','on')
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.alarma_sensor_movimiento_blink_piscina','on') %} mdi:motion-sensor
        {% else %} mdi:motion-sensor-off
        {% endif %}

    - name: alarma_sensor_movimiento_blink_porche
      unique_id: alarma_sensor_movimiento_blink_porche
      state: >-
        {%  if is_state('binary_sensor.blink_porche_camera_armed','on')
            and is_state('binary_sensor.blink_porche_motion_detected','on')
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.alarma_sensor_movimiento_blink_porche','on') %} mdi:motion-sensor
        {% else %} mdi:motion-sensor-off
        {% endif %}

    # ------------------------------------------------------------
    # SENSORES PRESENCIA EXTERIOR (ALARMA)
    # ------------------------------------------------------------
    - name: alarma_sensor_movimiento_entrada_exterior
      unique_id: alarma_sensor_movimiento_entrada_exterior
      state: >-
        {%  if is_state('input_boolean.control_alarma_sensor_presencia_entrada_exterior','on')
            and is_state('binary_sensor.aqara_movimiento_entrada_exterior','on')
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.alarma_sensor_movimiento_entrada_exterior','on') %} mdi:motion-sensor
        {% else %} mdi:motion-sensor-off
        {% endif %}

    - name: alarma_sensor_movimiento_ikea_cancela
      unique_id: alarma_sensor_movimiento_ikea_cancela
      state: >-
        {%  if is_state('input_boolean.control_alarma_sensor_presencia_ikea_cancela','on')
            and is_state('binary_sensor.ikea_sensor_movimiento_entrada_exterior','on')
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.ikea_sensor_movimiento_entrada_exterior','on') %} mdi:motion-sensor
        {% else %} mdi:motion-sensor-off
        {% endif %}

    # ------------------------------------------------------------
    # SONOFF POW SW2
    # ------------------------------------------------------------
    - name: esphome_pow_sw2_switch
      unique_id: esphome_pow_sw2_switch
      state: >-
        {% if is_state('switch.esphome_pow_sw2','on') %}
          true
        {% else %}
          false
        {% endif %}

    - name: esphome_pow_sw2_blue_led
      unique_id: esphome_pow_sw2_blue_led
      state: >-
        {% if is_state('light.esphome_pow_sw2_led','on') %}
          true
        {% else %}
          false
        {% endif %}

    - name: esphome_pow_sw2_current
      unique_id: esphome_pow_sw2_current
      state: >-
        {% if states('sensor.esphome_pow_sw2_current')|int(0) > 0 %}
          true
        {% else %}
          false
        {% endif %}

    - name: esphome_pow_sw2_power
      unique_id: esphome_pow_sw2_power
      state: >-
        {% if states('sensor.esphome_pow_sw2_power')|int(0) > 0 %}
          true
        {% else %}
          false
        {% endif %}

    - name: esphome_pow_sw2_voltage
      unique_id: esphome_pow_sw2_voltage
      state: >-
        {% if states('sensor.esphome_pow_sw2_voltage')|int(0) > 0 %}
          true
        {% else %}
          false
        {% endif %}

    # ------------------------------------------------------------
    # PISCINA DEPURADORA
    # ------------------------------------------------------------
    - name: piscina_interruptor_global
      unique_id: piscina_interruptor_global
      state: >-
        {% if is_state('input_boolean.piscina_interruptor_global','on') %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('input_boolean.piscina_interruptor_global','on') %} mdi:pool
        {% else %} mdi:swim
        {% endif %}
      # friendly_name (referencia): 'Interruptor General Piscina'

    - name: piscina_depuradora_ch0_status
      unique_id: piscina_depuradora_ch0_status
      state: >-
        {% if is_state('switch.esphome_pow_sw3','on') %}
          true
        {% else %}
          false
        {% endif %}
      icon: mdi:pool
      # friendly_name (referencia): 'Motor Depuradora Piscina'

    - name: esphome_pow_sw3_blue_led
      unique_id: esphome_pow_sw3_blue_led
      state: >-
        {% if is_state('light.esphome_pow_sw3_led','on') %}
          true
        {% else %}
          false
        {% endif %}

    - name: esphome_pow_sw3_current
      unique_id: esphome_pow_sw3_current
      state: >-
        {% if states('sensor.esphome_pow_sw3_current')|int(0) > 1 %}
          true
        {% else %}
          false
        {% endif %}

    - name: esphome_pow_sw3_power
      unique_id: esphome_pow_sw3_power
      state: >-
        {% if states('sensor.esphome_pow_sw3_power')|int(0) > 1 %}
          true
        {% else %}
          false
        {% endif %}

    - name: esphome_pow_sw3_voltage
      unique_id: esphome_pow_sw3_voltage
      state: >-
        {% if states('sensor.esphome_pow_sw3_voltage')|int(0) > 1 %}
          true
        {% else %}
          false
        {% endif %}

    - name: piscina_depuradora_ch0_motor_on
      unique_id: piscina_depuradora_ch0_motor_on
      state: >-
        {%  if states('sensor.esphome_pow_sw3_voltage')|int(0) > 200
            and states('sensor.esphome_pow_sw3_power')|round(1) > 1.0
        %}
          true
        {% else %}
          false
        {% endif %}

    - name: piscina_depuradora_ch0_warning
      unique_id: piscina_depuradora_ch0_warning
      state: >-
        {%  if states('sensor.esphome_pow_sw3_voltage')|int(0) > 200
            and states('sensor.esphome_pow_sw3_power')|round(1) > 4.0
        %}
          true
        {% else %}
          false
        {% endif %}

    - name: piscina_depuradora_ch0_on
      unique_id: piscina_depuradora_ch0_on
      state: >-
        {% if is_state('switch.esphome_pow_sw3','on') %}
          true
        {% else %}
          false
        {% endif %}
      icon: mdi:power
      # friendly_name (referencia): 'Depuradora on/off'

    - name: piscina_depuradora_ch0_dia_ejecucion_t1
      unique_id: piscina_depuradora_ch0_dia_ejecucion_t1
      state: >-
        {% if is_state('input_select.piscina_depuradora_ch0_programador_dias','Diario') and is_state('input_boolean.piscina_depuradora_ch0_programador_t1','on') %}
          true
        {% elif is_state('input_select.piscina_depuradora_ch0_programador_dias','Días Pares')
            and is_state('input_boolean.piscina_depuradora_ch0_programador_t1','on')
            and (now().day % 2 == 0) 
        %}
          true
        {% elif is_state('input_select.piscina_depuradora_ch0_programador_dias','Sábado') and now().weekday() | int == 5 and is_state('input_boolean.piscina_depuradora_ch0_programador_t1','on') %}
          true
        {% elif is_state('input_select.piscina_depuradora_ch0_programador_dias','Domingo') and now().weekday() | int == 6 and is_state('input_boolean.piscina_depuradora_ch0_programador_t1','on') %}
          true
        {% elif is_state('input_select.piscina_depuradora_ch0_programador_dias','Weekend') and now().weekday() | int in (5,6) and is_state('input_boolean.piscina_depuradora_ch0_programador_t1','on') %}
          true
        {% else %}
          false
        {% endif %}
      icon: mdi:calendar-check
      # friendly_name (referencia): '¿Próxima Ejecución Hoy? (CH0-T1)'

    - name: piscina_depuradora_ch0_dia_ejecucion_t2
      unique_id: piscina_depuradora_ch0_dia_ejecucion_t2
      state: >-
        {% if is_state('input_select.piscina_depuradora_ch0_programador_dias','Diario') and is_state('input_boolean.piscina_depuradora_ch0_programador_t2','on') %}
          true
        {% elif is_state('input_select.piscina_depuradora_ch0_programador_dias','Días Pares') 
            and is_state('input_boolean.piscina_depuradora_ch0_programador_t2','on')
            and (now().day % 2 == 0) 
        %}
          true
        {% elif is_state('input_select.piscina_depuradora_ch0_programador_dias','Sábado') and now().weekday() | int == 5 and is_state('input_boolean.piscina_depuradora_ch0_programador_t2','on') %}
          true
        {% elif is_state('input_select.piscina_depuradora_ch0_programador_dias','Domingo') and now().weekday() | int == 6 and is_state('input_boolean.piscina_depuradora_ch0_programador_t2','on') %}
          true
        {% elif is_state('input_select.piscina_depuradora_ch0_programador_dias','Weekend') and now().weekday() | int in (5,6) and is_state('input_boolean.piscina_depuradora_ch0_programador_t2','on') %}
          true
        {% else %}
          false
        {% endif %}
      icon: mdi:calendar-check
      # friendly_name (referencia): '¿Próxima Ejecución Hoy? (CH0-T2)'

    - name: piscina_depuradora_ch0_dia_ejecucion
      unique_id: piscina_depuradora_ch0_dia_ejecucion
      state: >-
        {% if is_state('input_boolean.piscina_interruptor_global','on')
              and (is_state('binary_sensor.piscina_depuradora_ch0_dia_ejecucion_t1','on') or is_state('binary_sensor.piscina_depuradora_ch0_dia_ejecucion_t2','on'))
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: mdi:pool
      # friendly_name (referencia): '¿Próxima Ejecución Hoy? (CH0)'

    # ------------------------------------------------------------
    # RIEGO BOMBA POZO
    # ------------------------------------------------------------
    - name: esphome_pow_sw4_current
      unique_id: esphome_pow_sw4_current
      state: >-
        {% if states('sensor.esphome_pow_sw4_current')|int(0) > 1 %}
          true
        {% else %}
          false
        {% endif %}

    - name: esphome_pow_sw4_power
      unique_id: esphome_pow_sw4_power
      state: >-
        {% if states('sensor.esphome_pow_sw4_power')|int(0) > 1 %}
          true
        {% else %}
          false
        {% endif %}

    - name: esphome_pow_sw4_voltage
      unique_id: esphome_pow_sw4_voltage
      state: >-
        {% if states('sensor.esphome_pow_sw4_voltage')|int(0) > 1 %}
          true
        {% else %}
          false
        {% endif %}

    - name: riego_bomba_pozo_status
      unique_id: riego_bomba_pozo_status
      state: >-
        {% if is_state('switch.esphome_pow_sw4','on') %}
          true
        {% else %}
          false
        {% endif %}
      icon: mdi:water-well
      # friendly_name (referencia): 'Control Bomba Riego'

    - name: riego_bomba_pozo_motor_on
      unique_id: riego_bomba_pozo_motor_on
      state: >-
        {%  if states('sensor.esphome_pow_sw4_voltage')|int(0) > 200
            and states('sensor.esphome_pow_sw4_power')|round(1) > 100
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: mdi:flash-outline

    - name: riego_bomba_pozo_warning_motor_off
      unique_id: riego_bomba_pozo_warning_motor_off
      state: >-
        {% if (is_state('binary_sensor.riego_cesped_ch1_status','on') or
               is_state('binary_sensor.riego_cesped_ch2_status','on') or
               is_state('binary_sensor.riego_cesped_ch3_status','on')
              ) and states('sensor.esphome_pow_sw4_power')|round(1) < 100
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: mdi:flash-alert

    - name: riego_bomba_pozo_warning_consumo
      unique_id: riego_bomba_pozo_warning_consumo
      state: >-
        {%  if states('sensor.esphome_pow_sw4_voltage')|int(0) > 200
            and states('sensor.esphome_pow_sw4_power')|round(1) > 1800
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: mdi:flash-alert

    # ------------------------------------------------------------
    # AEMET PREVISION METEOROLOGICA
    # ------------------------------------------------------------
    - name: aemet_prevision_lluvia_0d
      unique_id: aemet_prevision_lluvia_0d
      state: >-
        {% if (is_state('sensor.aemet_icono_0d','rainy') or
               is_state('sensor.aemet_icono_0d','snow') or
               is_state('sensor.aemet_icono_0d','sleet')
              ) and states('sensor.aemet_lluvia_0d')|int(0)>=80
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.aemet_prevision_lluvia_0d','on') %} mdi:weather-rainy
        {% else %} mdi:weather-sunny
        {% endif %}
      # friendly_name (referencia): 'Pronóstico Lluvia 0d'

    - name: aemet_prevision_lluvia_1d
      unique_id: aemet_prevision_lluvia_1d
      state: >-
        {% if (is_state('sensor.aemet_icono_1d','rainy') or
               is_state('sensor.aemet_icono_1d','snow') or
               is_state('sensor.aemet_icono_1d','sleet')
              ) and states('sensor.aemet_lluvia_1d')|int(0)>=80
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.aemet_prevision_lluvia_1d','on') %} mdi:weather-rainy
        {% else %} mdi:weather-sunny
        {% endif %}
      # friendly_name (referencia): 'Pronóstico Lluvia +1d'

    - name: aemet_prevision_lluvia_2d
      unique_id: aemet_prevision_lluvia_2d
      state: >-
        {% if (is_state('sensor.aemet_icono_2d','rainy') or
               is_state('sensor.aemet_icono_2d','snow') or
               is_state('sensor.aemet_icono_2d','sleet')
              ) and states('sensor.aemet_lluvia_2d')|int(0)>=80
        %}
          true
        {% else %}
          false

        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.alarma_sensor_movimiento_blink_hall','on') %} mdi:motion-sensor
        {% else %} mdi:motion-sensor-off
        {% endif %}

    - name: alarma_sensor_movimiento_blink_estudio
      unique_id: alarma_sensor_movimiento_blink_estudio
      state: >-
        {%  if is_state('binary_sensor.blink_estudio_camera_armed','on')
            and is_state('binary_sensor.blink_estudio_motion_detected','on')
        %}

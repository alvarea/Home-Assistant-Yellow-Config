        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.alarma_sensor_movimiento_blink_estudio','on') %} mdi:motion-sensor
        {% else %} mdi:motion-sensor-off
        {% endif %}

    - name: alarma_sensor_movimiento_blink_cocina
      unique_id: alarma_sensor_movimiento_blink_cocina
      state: >-
        {%  if is_state('binary_sensor.blink_cocina_camera_armed','on')
            and is_state('binary_sensor.blink_cocina_motion_detected','on')
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.alarma_sensor_movimiento_blink_cocina','on') %} mdi:motion-sensor
        {% else %} mdi:motion-sensor-off
        {% endif %}

    - name: alarma_sensor_movimiento_blink_salon
      unique_id: alarma_sensor_movimiento_blink_salon
      state: >-
        {%  if is_state('binary_sensor.blink_salon_camera_armed','on')
            and is_state('binary_sensor.blink_salon_motion_detected','on')
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.alarma_sensor_movimiento_blink_salon','on') %} mdi:motion-sensor
        {% else %} mdi:motion-sensor-off
        {% endif %}

    - name: alarma_sensor_movimiento_blink_cancela_left
      unique_id: alarma_sensor_movimiento_blink_cancela_left
      state: >-
        {%  if is_state('binary_sensor.blink_cancela_left_camera_armed','on')
            and is_state('binary_sensor.blink_cancela_left_motion_detected','on')
        %}
          true
        {% else %}
          false
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.alarma_sensor_movimiento_blink_cancela_left','on') %} mdi:motion-sensor
        {% else %} mdi:motion-sensor-off
        {% endif %}

    - name: alarma_sensor_movimiento_blink_cancela_right
      unique_id: alarma_sensor_movimiento_blink_cancela_right
      state: >-
        {%  if is_state('binary_sensor.blink_cancela_right_camera_armed','on')

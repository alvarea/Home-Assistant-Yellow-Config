title: Alarma HOMY
views:
  - title: Alarma
    path: alarma
    icon: mdi:shield-home
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - show_state: false
            show_name: true
            camera_view: auto
            fit_mode: cover
            type: picture-entity
            entity: alarm_control_panel.alarm_homy
            name: Estado
            image:
              media_content_id: /local/Home_Alarm_Security_I3.jpg
            tap_action:
              action: none
            hold_action:
              action: none
            grid_options:
              columns: 12
            aspect_ratio: '4'
          - type: heading
            icon: mdi:account-convert
            heading: Presencia
            heading_style: title
            badges:
              - type: entity
                entity: binary_sensor.family_any_home
              - type: entity
                entity: binary_sensor.family_all_home
              - type: entity
                entity: sensor.family_home
              - type: entity
                entity: sensor.family_sleep_home
          - cards:
              - cards:
                  - type: tile
                    entity: person.agustin
                    show_entity_picture: true
                    vertical: true
                    state_content: last_changed
                  - type: custom:mushroom-person-card
                    entity: person.malen
                    icon_type: entity-picture
                    layout: vertical
                    fill_container: true
                    secondary_info: last-changed
                  - type: custom:mushroom-person-card
                    entity: person.agu
                    icon_type: entity-picture
                    layout: vertical
                    fill_container: true
                    secondary_info: last-changed
                  - type: custom:mushroom-person-card
                    entity: person.paloma
                    icon_type: entity-picture
                    layout: vertical
                    fill_container: true
                    secondary_info: last-changed
                type: horizontal-stack
            type: vertical-stack
          - features:
              - type: alarm-modes
                modes:
                  - disarmed
                  - armed_home
                  - armed_night
                  - armed_away
                  - armed_vacation
            type: custom:mushroom-template-card
            entity: alarm_control_panel.alarm_homy
            grid_options:
              columns: 12
            primary: '{% set e = states(''alarm_control_panel.alarm_homy'') %}{% set m = {''disarmed'':''Desarmada'',''arming'':''Armando…'',''armed_home'':''Armada Casa'',''armed_night'':''Armada Noche'',''armed_away'':''Armada Ausente'',''armed_vacation'':''Armada Vacaciones'',''pending'':''¡Entrada detectada!'',''triggered'':''¡ALARMA DISPARADA!''} %}Alarma HOMY · {{ m.get(e, e) | upper }}'
            secondary: '{% set e = states(''alarm_control_panel.alarm_homy'') %}{% set modo = {''armed_home'':''Casa'',''armed_night'':''Noche'',''armed_away'':''Ausente'',''armed_vacation'':''Vacaciones''}.get(states(''input_select.alarm_homy_modo''), '''') %}{% if e in [''pending'',''triggered'',''arming''] and modo %}{{ modo }} · {% endif %}desde {{ as_local(states.alarm_control_panel.alarm_homy.last_changed).strftime(''%H:%M'') }}'
            icon: '{% set e = states(''alarm_control_panel.alarm_homy'') %}{{ {''disarmed'':''mdi:shield-off'',''arming'':''mdi:shield-sync'',''armed_home'':''mdi:home-account'',''armed_night'':''mdi:weather-night'',''armed_away'':''mdi:home-export-outline'',''armed_vacation'':''mdi:airplane'',''pending'':''mdi:shield-alert'',''triggered'':''mdi:alarm-light''}.get(e,''mdi:shield'') }}'
            tap_action:
              action: more-info
            color: '{% set e = states(''alarm_control_panel.alarm_homy'') %}{{ {''disarmed'':''blue-grey'',''arming'':''grey'',''armed_home'':''purple'',''armed_night'':''blue'',''armed_away'':''orange'',''armed_vacation'':''deep-orange'',''pending'':''red'',''triggered'':''red''}.get(e,''grey'') }}'
            features_position: bottom
            area: 9d6ff7118aff4fe1a55c43a4c9b9583e
            multiline_secondary: true
          - features:
              - type: alarm-modes
                modes:
                  - disarmed
                  - armed_home
                  - armed_night
                  - armed_away
                  - armed_vacation
            type: custom:mushroom-template-card

              - state
              - abiertos
            grid_options:
              columns: 12
            color: green
            icon: mdi:shield-check
            visibility:
              - condition: state
                entity: binary_sensor.alarm_homy_lista_para_armar
                state: 'on'
          - type: tile
            entity: binary_sensor.alarm_homy_no_lista_para_armar
            name: No lista para armar
            state_content:
              - abiertos
            grid_options:
              columns: 12
            color: amber
            icon: mdi:shield-alert
            visibility:
              - condition: state
                entity: binary_sensor.alarm_homy_lista_para_armar
                state: 'off'
          - type: tile

            tap_action:
              action: more-info
            color: '{% set e = states(''alarm_control_panel.blink_casa'') %}{{ {''disarmed'':''blue-grey'',''arming'':''grey'',''armed_home'':''purple'',''armed_night'':''blue'',''armed_away'':''orange'',''armed_vacation'':''deep-orange'',''pending'':''red'',''triggered'':''red''}.get(e,''grey'') }}'
            features_position: bottom
            area: 9d6ff7118aff4fe1a55c43a4c9b9583e
            multiline_secondary: true

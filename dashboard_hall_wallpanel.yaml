            primary: '{% set e = states(''alarm_control_panel.blink_casa'') %}{% set m = {''disarmed'':''Desarmada'',''arming'':''Armando…'',''armed_home'':''Armada Casa'',''armed_night'':''Armada Noche'',''armed_away'':''Armada Ausente'',''armed_vacation'':''Armada Vacaciones'',''pending'':''¡Entrada detectada!'',''triggered'':''¡ALARMA DISPARADA!''} %}Alarma Blink · {{ m.get(e, e) | upper }}'

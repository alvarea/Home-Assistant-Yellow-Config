###############################################################################
#  ALARM HOMY · Motor de alarma propio (package)
#
#  - Helpers (estado, modo, timers, tiempos, interruptores) y etiquetas: en la UI,
#    todos con prefijo alarm_homy_ y etiqueta "alarm_homy".
#  - Configuración por sensor: etiquetas alarm_homy_* en la UI (ver custom_templates/alarm_homy.jinja).
#  - Este fichero solo contiene lógica: panel, sensores del motor, scripts y automatizaciones.
#
#  Estados (input_select.alarm_homy_estado):
#    disarmed → arming (timer salida) → armed_x → pending (timer entrada) → triggered (timer disparo) → armed_x
#  Eventos emitidos:
#    alarm_homy_fallo_armado       {modo, origen, sensores, nombres}
#    alarm_homy_registrar_disparo  {sensores, origen}
#    alarm_homy_reset_disparo      {}
#    alarm_homy_codigo_incorrecto  {origen}
#    alarm_homy_desarmado          {origen, desde, modo, tipo, nocturno}
#  Casa nocturno (2026-10-21, ALA-30): armar Noche con actividad arriba (binary_sensor.alarm_homy_actividad_estudio)
#    arma Casa + input_boolean.alarm_homy_noche_pendiente; la subida a Noche está en alarm_homy_auto.yaml.
###############################################################################

input_boolean:
  # ALA-30: Casa armado en lugar de Noche por actividad arriba; sube a Noche al quedar libre
  alarm_homy_noche_pendiente:
    name: Alarma · Casa nocturno (Noche pendiente)
    icon: mdi:weather-night-partly-cloudy

input_select:
  # Vista "Sensores Activos" del dashboard: modo que se previsualiza con la alarma desarmada (2026-10-16)
  alarm_homy_modo_vista:
    name: Alarma · modo a previsualizar
    icon: mdi:eye
    options: [Casa, Noche, Ausente, Vacaciones]
    initial: Ausente

template:
  # ---------------------------------------------------------------------------
  # CUENTA ATRÁS de los timers en m:ss (para mostrarla en grande en el dashboard; 2026-10-16).
  # Solo se actualiza cada segundo mientras algún timer de la alarma está activo.
  # ---------------------------------------------------------------------------
  - trigger:
      - trigger: time_pattern
        seconds: "/1"
      - trigger: state
        entity_id: [timer.alarm_homy_salida, timer.alarm_homy_entrada, timer.alarm_homy_disparo]
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.platform == 'state' or
             ['timer.alarm_homy_salida', 'timer.alarm_homy_entrada', 'timer.alarm_homy_disparo'] | select('is_state', 'active') | list | count > 0 }}
    sensor:
      - name: alarm_homy_restante_salida
        unique_id: alarm_homy_restante_salida
        icon: mdi:timer-sand
        state: >-
          {%- set f = state_attr('timer.alarm_homy_salida', 'finishes_at') -%}
          {%- set r = ([0, (as_timestamp(f) - as_timestamp(now())) | round(0, 'ceil') | int] | max) if is_state('timer.alarm_homy_salida', 'active') and f else 0 -%}
          {{ '%d:%02d' | format(r // 60, r % 60) }}
      - name: alarm_homy_restante_entrada
        unique_id: alarm_homy_restante_entrada
        icon: mdi:timer-alert-outline
        state: >-
          {%- set f = state_attr('timer.alarm_homy_entrada', 'finishes_at') -%}
          {%- set r = ([0, (as_timestamp(f) - as_timestamp(now())) | round(0, 'ceil') | int] | max) if is_state('timer.alarm_homy_entrada', 'active') and f else 0 -%}
          {{ '%d:%02d' | format(r // 60, r % 60) }}
      - name: alarm_homy_restante_disparo
        unique_id: alarm_homy_restante_disparo
        icon: mdi:alarm-light
        state: >-
          {%- set f = state_attr('timer.alarm_homy_disparo', 'finishes_at') -%}
          {%- set r = ([0, (as_timestamp(f) - as_timestamp(now())) | round(0, 'ceil') | int] | max) if is_state('timer.alarm_homy_disparo', 'active') and f else 0 -%}
          {{ '%d:%02d' | format(r // 60, r % 60) }}

  # ---------------------------------------------------------------------------
  # BOTONES DE ARMADO del dashboard (2026-10-16): tile + feature "button" (sin confirmación).
  # Nombre e icono indican el modo activo; atributo "info" = descripción o estado del modo.
  # ---------------------------------------------------------------------------
  - button:
      - name: "{{ '● Casa · ACTIVO' if (states('input_select.alarm_homy_modo') == 'armed_home' and states('input_select.alarm_homy_estado') != 'disarmed') else 'Casa' }}"
        unique_id: alarm_homy_boton_casa
        default_entity_id: button.alarm_homy_armar_casa
        icon: "{{ 'mdi:check-circle' if (states('input_select.alarm_homy_modo') == 'armed_home' and states('input_select.alarm_homy_estado') != 'disarmed') else 'mdi:home-account' }}"
        attributes:
          info: >-
            {%- set e = states('input_select.alarm_homy_estado') -%}
            {%- if (states('input_select.alarm_homy_modo') == 'armed_home' and states('input_select.alarm_homy_estado') != 'disarmed') -%}
              {{ 'Armando… ' ~ states('sensor.alarm_homy_restante_salida') if e == 'arming' else ('Desde las ' ~ as_local(states.input_select.alarm_homy_estado.last_changed).strftime('%H:%M') if e == 'armed_home' else '¡Entrada o disparo!') }}
            {%- else -%}Planta baja · entrada {{ states('input_number.alarm_homy_casa_entrada') | int }} s{%- endif -%}
        press:
          - condition: template
            value_template: "{{ not (states('input_select.alarm_homy_modo') == 'armed_home' and states('input_select.alarm_homy_estado') != 'disarmed') }}"
          - action: script.alarm_homy_armar
            data: {modo: armed_home, origen: dashboard}
      - name: "{{ '● Noche · ACTIVO' if (states('input_select.alarm_homy_modo') == 'armed_night' and states('input_select.alarm_homy_estado') != 'disarmed') else 'Noche' }}"
        unique_id: alarm_homy_boton_noche
        default_entity_id: button.alarm_homy_armar_noche
        icon: "{{ 'mdi:check-circle' if (states('input_select.alarm_homy_modo') == 'armed_night' and states('input_select.alarm_homy_estado') != 'disarmed') else 'mdi:weather-night' }}"
        attributes:
          info: >-
            {%- set e = states('input_select.alarm_homy_estado') -%}
            {%- if (states('input_select.alarm_homy_modo') == 'armed_night' and states('input_select.alarm_homy_estado') != 'disarmed') -%}
              {{ 'Armando… ' ~ states('sensor.alarm_homy_restante_salida') if e == 'arming' else ('Desde las ' ~ as_local(states.input_select.alarm_homy_estado.last_changed).strftime('%H:%M') if e == 'armed_night' else '¡Entrada o disparo!') }}
            {%- else -%}Perímetro + planta alta · entrada {{ states('input_number.alarm_homy_noche_entrada') | int }} s{%- endif -%}
        press:
          - condition: template
            value_template: "{{ not (states('input_select.alarm_homy_modo') == 'armed_night' and states('input_select.alarm_homy_estado') != 'disarmed') }}"
          - action: script.alarm_homy_armar
            data: {modo: armed_night, origen: dashboard}
      - name: "{{ '● Ausente · ACTIVO' if (states('input_select.alarm_homy_modo') == 'armed_away' and states('input_select.alarm_homy_estado') != 'disarmed') else 'Ausente' }}"
        unique_id: alarm_homy_boton_ausente
        default_entity_id: button.alarm_homy_armar_ausente
        icon: "{{ 'mdi:check-circle' if (states('input_select.alarm_homy_modo') == 'armed_away' and states('input_select.alarm_homy_estado') != 'disarmed') else 'mdi:home-export-outline' }}"
        attributes:
          info: >-
            {%- set e = states('input_select.alarm_homy_estado') -%}
            {%- if (states('input_select.alarm_homy_modo') == 'armed_away' and states('input_select.alarm_homy_estado') != 'disarmed') -%}
              {{ 'Armando… ' ~ states('sensor.alarm_homy_restante_salida') if e == 'arming' else ('Desde las ' ~ as_local(states.input_select.alarm_homy_estado.last_changed).strftime('%H:%M') if e == 'armed_away' else '¡Entrada o disparo!') }}
            {%- else -%}Todo + Blink · salida {{ states('input_number.alarm_homy_ausente_salida') | int }} s · entrada {{ states('input_number.alarm_homy_ausente_entrada') | int }} s{%- endif -%}
        press:
          - condition: template
            value_template: "{{ not (states('input_select.alarm_homy_modo') == 'armed_away' and states('input_select.alarm_homy_estado') != 'disarmed') }}"
          - action: script.alarm_homy_armar
            data: {modo: armed_away, origen: dashboard}
      - name: "{{ '● Vacaciones · ACTIVO' if (states('input_select.alarm_homy_modo') == 'armed_vacation' and states('input_select.alarm_homy_estado') != 'disarmed') else 'Vacaciones' }}"
        unique_id: alarm_homy_boton_vacaciones
        default_entity_id: button.alarm_homy_armar_vacaciones
        icon: "{{ 'mdi:check-circle' if (states('input_select.alarm_homy_modo') == 'armed_vacation' and states('input_select.alarm_homy_estado') != 'disarmed') else 'mdi:airplane' }}"
        attributes:
          info: >-
            {%- set e = states('input_select.alarm_homy_estado') -%}
            {%- if (states('input_select.alarm_homy_modo') == 'armed_vacation' and states('input_select.alarm_homy_estado') != 'disarmed') -%}
              {{ 'Armando… ' ~ states('sensor.alarm_homy_restante_salida') if e == 'arming' else ('Desde las ' ~ as_local(states.input_select.alarm_homy_estado.last_changed).strftime('%H:%M') if e == 'armed_vacation' else '¡Entrada o disparo!') }}
            {%- else -%}Todo + Blink completo · salida {{ states('input_number.alarm_homy_vacaciones_salida') | int }} s{%- endif -%}
        press:
          - condition: template
            value_template: "{{ not (states('input_select.alarm_homy_modo') == 'armed_vacation' and states('input_select.alarm_homy_estado') != 'disarmed') }}"
          - action: script.alarm_homy_armar
            data: {modo: armed_vacation, origen: dashboard}

  # ---------------------------------------------------------------------------
  # PANEL
  # ---------------------------------------------------------------------------
  - alarm_control_panel:
      - name: Alarm HOMY
        unique_id: alarm_homy
        state: "{{ states('input_select.alarm_homy_estado') }}"
        code_arm_required: false
        code_format: number
        arm_away:
          - action: script.alarm_homy_armar
            data: {modo: armed_away, origen: panel}
        arm_home:
          - action: script.alarm_homy_armar
            data: {modo: armed_home, origen: panel}
        arm_night:
          - action: script.alarm_homy_armar
            data: {modo: armed_night, origen: panel}
        arm_vacation:
          - action: script.alarm_homy_armar
            data: {modo: armed_vacation, origen: panel}
        disarm:
          - action: script.alarm_homy_desarmar
            data:
              code: "{{ code }}"
              origen: panel
        trigger:
          - action: script.alarm_homy_panico
            data: {tipo: panico_silencioso, origen: panel}

  # ---------------------------------------------------------------------------
  # SENSORES ACTIVOS: los que han saltado tras el último cambio de estado
  # ---------------------------------------------------------------------------
  - sensor:
      - name: alarm_homy_activos
        unique_id: alarm_homy_activos
        icon: mdi:shield-alert
        state: >-
          {% from 'alarm_homy.jinja' import activos %}{{ activos() | from_json | count }}
        attributes:
          entidades: >-
            {% from 'alarm_homy.jinja' import activos %}{{ activos() | from_json }}

  # ---------------------------------------------------------------------------
  # LISTA PARA ARMAR: ninguna puerta/ventana de la alarma abierta (LED verde/rojo en reposo)
  # ---------------------------------------------------------------------------
  - binary_sensor:
      - name: alarm_homy_lista_para_armar
        unique_id: alarm_homy_lista_para_armar
        icon: mdi:shield-check-outline
        state: >-
          {% from 'alarm_homy.jinja' import perimetro_abierto %}{{ perimetro_abierto() | from_json | count == 0 }}
        attributes:
          abiertos: >-
            {% from 'alarm_homy.jinja' import perimetro_abierto, nombres %}{{ nombres(perimetro_abierto() | from_json) }}

  # Inverso de "lista para armar" (para que el tile se muestre activo/ámbar cuando NO está lista)
  - binary_sensor:
      - name: alarm_homy_no_lista_para_armar
        unique_id: alarm_homy_no_lista_para_armar
        icon: mdi:shield-alert
        state: "{{ is_state('binary_sensor.alarm_homy_lista_para_armar', 'off') }}"
        attributes:
          abiertos: "{{ state_attr('binary_sensor.alarm_homy_lista_para_armar', 'abiertos') }}"

  # ---------------------------------------------------------------------------
  # AVERÍAS: sensores de la alarma sin comunicación > 2 min (pila, cobertura...)
  # ---------------------------------------------------------------------------
  - sensor:
      - name: alarm_homy_averias
        unique_id: alarm_homy_averias
        icon: mdi:access-point-network-off
        state_class: measurement
        state: >-
          {% from 'alarm_homy.jinja' import averias %}{{ averias() | from_json | count }}
        attributes:
          entidades: >-
            {% from 'alarm_homy.jinja' import averias %}{{ averias() | from_json }}
          nombres: >-
            {% from 'alarm_homy.jinja' import averias, nombres %}{{ nombres(averias() | from_json) }}

  # ---------------------------------------------------------------------------
  # REGISTRO DEL DISPARO (persistente): primer sensor + lista acumulada
  # ---------------------------------------------------------------------------
  - trigger:
      - trigger: event
        event_type: alarm_homy_registrar_disparo
        id: registrar
      - trigger: event
        event_type: alarm_homy_reset_disparo
        id: reset
    sensor:
      - name: alarm_homy_disparo
        unique_id: alarm_homy_disparo
        icon: mdi:alarm-light
        state: >-
          {% if trigger.id == 'reset' %}ninguno
          {% elif this.state in ['ninguno', 'unknown', 'unavailable', '', none] %}
            {%- set e = trigger.event.data.sensores[0] -%}
            {{ 'PÁNICO' if e == 'panico' else (state_attr(e, 'friendly_name') or e) }}
          {% else %}{{ this.state }}{% endif %}
        attributes:
          entity_id: >-
            {% if trigger.id == 'reset' %}{{ none }}
            {% elif this.state in ['ninguno', 'unknown', 'unavailable', '', none] %}{{ trigger.event.data.sensores[0] }}
            {% else %}{{ this.attributes.get('entity_id') }}{% endif %}
          area: >-
            {% if trigger.id == 'reset' %}{{ none }}
            {% elif this.state in ['ninguno', 'unknown', 'unavailable', '', none] %}{{ area_name(trigger.event.data.sensores[0]) }}
            {% else %}{{ this.attributes.get('area') }}{% endif %}
          hora: >-
            {% if trigger.id == 'reset' %}{{ none }}
            {% elif this.state in ['ninguno', 'unknown', 'unavailable', '', none] %}{{ now().strftime('%H:%M:%S') }}
            {% else %}{{ this.attributes.get('hora') }}{% endif %}
          origen: >-
            {% if trigger.id == 'reset' %}{{ none }}
            {% else %}{{ trigger.event.data.get('origen', 'sensor') }}{% endif %}
          # Detalle del primer sensor (estado al que pasó y hora) y de todos los del disparo
          detalle: >-
            {%- from 'alarm_homy.jinja' import detalle -%}
            {% if trigger.id == 'reset' %}{{ none }}
            {% elif this.state in ['ninguno', 'unknown', 'unavailable', '', none] %}{{ detalle(trigger.event.data.sensores[0]) }}
            {% else %}{{ this.attributes.get('detalle') }}{% endif %}
          detalles: >-
            {%- from 'alarm_homy.jinja' import detalle -%}
            {% if trigger.id == 'reset' %}{{ [] }}
            {% else %}
              {%- set previas = this.attributes.get('entidades') or [] -%}
              {%- set ns = namespace(l=(this.attributes.get('detalles') or [])) -%}
              {%- for e in trigger.event.data.sensores | unique if e not in previas -%}
                {%- set ns.l = ns.l + [detalle(e)] -%}
              {%- endfor -%}
              {{ ns.l }}
            {% endif %}
          entidades: >-
            {% if trigger.id == 'reset' %}{{ [] }}
            {% else %}{{ ((this.attributes.get('entidades') or []) + trigger.event.data.sensores) | unique | list }}{% endif %}
          lista: >-
            {% if trigger.id == 'reset' %}{{ [] }}
            {% else %}
              {%- set ns = namespace(l=[]) -%}
              {%- for e in ((this.attributes.get('entidades') or []) + trigger.event.data.sensores) | unique -%}
                {%- set ns.l = ns.l + ['PÁNICO' if e == 'panico' else (state_attr(e, 'friendly_name') or e)] -%}
              {%- endfor -%}
              {{ ns.l }}
            {% endif %}

script:
  # ---------------------------------------------------------------------------
  # ARMAR: comprueba sensores, Casa nocturno (ALA-30) y arranca el tiempo de salida
  # ---------------------------------------------------------------------------
  alarm_homy_armar:
    alias: Alarm HOMY · Armar
    icon: mdi:shield-lock
    mode: restart
    fields:
      modo:
        description: armed_away | armed_home | armed_night | armed_vacation
        required: true
        selector:
          select:
            options: [armed_away, armed_home, armed_night, armed_vacation]
      origen:
        description: panel, nfc, ios, alexa, automatico…
        selector:
          text:
    sequence:
      - variables:
          origen: "{{ origen | default('desconocido') }}"
          estado: "{{ states('input_select.alarm_homy_estado') }}"
      - condition: template
        value_template: "{{ estado not in ['pending', 'triggered'] }}"
      # Noche con actividad arriba → Casa nocturno (Casa + noche_pendiente). Si ya lo está, no se rearma.
      - variables:
          nocturno: "{{ modo == 'armed_night' and is_state('binary_sensor.alarm_homy_actividad_estudio', 'on') }}"
          modo: "{{ 'armed_home' if nocturno else modo }}"
      - condition: template
        value_template: "{{ not (nocturno and estado == 'armed_home' and is_state('input_boolean.alarm_homy_noche_pendiente', 'on')) }}"
      - variables:
          bloqueantes: >-
            {% from 'alarm_homy.jinja' import bloqueantes %}{{ bloqueantes(modo) | from_json }}
          txt: >-
            {% from 'alarm_homy.jinja' import texto_modo %}{{ texto_modo(modo) }}
          salida: "{{ states('input_number.alarm_homy_' ~ txt ~ '_salida') | int(0) }}"
      - if:
          - condition: template
            value_template: "{{ bloqueantes | count > 0 }}"
        then:
          - event: alarm_homy_fallo_armado
            event_data:
              modo: "{{ modo }}"
              origen: "{{ origen }}"
              sensores: "{{ bloqueantes }}"
              nombres: >-
                {% from 'alarm_homy.jinja' import nombres %}{{ nombres(bloqueantes) }}
          - stop: Fallo al armar
      - action: timer.cancel
        target:
          entity_id: [timer.alarm_homy_salida, timer.alarm_homy_entrada, timer.alarm_homy_disparo]
      # Antes de cambiar el estado: alarm_homy_acciones_estado la usa para callar la voz (ALA-32)
      - action: "input_boolean.turn_{{ 'on' if nocturno else 'off' }}"
        target: {entity_id: input_boolean.alarm_homy_noche_pendiente}
      - if:
          - condition: template
            value_template: "{{ nocturno }}"
        then:
          - action: logbook.log
            data:
              name: Alarm HOMY
              message: "Casa nocturno ({{ origen }}): {{ state_attr('binary_sensor.alarm_homy_actividad_estudio', 'motivos') }}. Sube a Noche cuando no haya actividad arriba"
              entity_id: alarm_control_panel.alarm_homy
      - event: alarm_homy_reset_disparo
      - action: input_select.select_option
        target: {entity_id: input_select.alarm_homy_tipo_disparo}
        data: {option: normal}
      - action: input_select.select_option
        target: {entity_id: input_select.alarm_homy_modo}
        data: {option: "{{ modo }}"}
      - if:
          - condition: template
            value_template: "{{ salida > 0 }}"
        then:
          - action: input_select.select_option
            target: {entity_id: input_select.alarm_homy_estado}
            data: {option: arming}
          - action: timer.start
            target: {entity_id: timer.alarm_homy_salida}
            data: {duration: "{{ salida }}"}
        else:
          - action: input_select.select_option
            target: {entity_id: input_select.alarm_homy_estado}
            data: {option: "{{ modo }}"}

  # ---------------------------------------------------------------------------
  # DESARMAR: valida código (si se pide) y resetea todo
  # ---------------------------------------------------------------------------
  alarm_homy_desarmar:
    alias: Alarm HOMY · Desarmar
    icon: mdi:shield-off
    mode: restart
    fields:
      code:
        description: Código (obligatorio si validar = true)
        selector:
          text:
      validar:
        description: false para llamadas internas de confianza (automatizaciones)
        default: true
        selector:
          boolean:
      origen:
        selector:
          text:
    sequence:
      - variables:
          pin: !secret alarm_control_code
          origen: "{{ origen | default('desconocido') }}"
          validar: "{{ validar | default(true) }}"
      - if:
          - condition: template
            value_template: "{{ validar and (code | default('') | string) != (pin | string) }}"
        then:
          - event: alarm_homy_codigo_incorrecto
            event_data: {origen: "{{ origen }}"}
          - stop: Código incorrecto
      - variables:
          desde: "{{ states('input_select.alarm_homy_estado') }}"
          modo_previo: "{{ states('input_select.alarm_homy_modo') }}"
          tipo_previo: "{{ states('input_select.alarm_homy_tipo_disparo') }}"
          nocturno_previo: "{{ modo_previo == 'armed_night' or is_state('input_boolean.alarm_homy_noche_pendiente', 'on') }}"
      - action: timer.cancel
        target:
          entity_id: [timer.alarm_homy_salida, timer.alarm_homy_entrada, timer.alarm_homy_disparo]
      - action: input_select.select_option
        target: {entity_id: input_select.alarm_homy_estado}
        data: {option: disarmed}
      - event: alarm_homy_desarmado
        event_data:
          origen: "{{ origen }}"
          desde: "{{ desde }}"
          modo: "{{ modo_previo }}"
          tipo: "{{ tipo_previo }}"
          nocturno: "{{ nocturno_previo }}"
      - action: input_select.select_option
        target: {entity_id: input_select.alarm_homy_modo}
        data: {option: disarmed}
      - action: input_select.select_option
        target: {entity_id: input_select.alarm_homy_tipo_disparo}
        data: {option: normal}
      - action: input_boolean.turn_off
        target: {entity_id: input_boolean.alarm_homy_noche_pendiente}

  # ---------------------------------------------------------------------------
  # DISPARAR: pasa a triggered y arranca el tiempo de disparo
  # ---------------------------------------------------------------------------
  alarm_homy_disparar:
    alias: Alarm HOMY · Disparar
    icon: mdi:alarm-light
    mode: single
    sequence:
      - variables:
          modo: "{{ states('input_select.alarm_homy_modo') }}"
          tipo: "{{ states('input_select.alarm_homy_tipo_disparo') }}"
          txt: >-
            {% from 'alarm_homy.jinja' import texto_modo %}{{ texto_modo(modo) }}
          duracion: >-
            {% if tipo != 'normal' or txt == '' %}{{ states('input_number.alarm_homy_panico_disparo') | int(300) }}
            {% else %}{{ states('input_number.alarm_homy_' ~ txt ~ '_disparo') | int(300) }}{% endif %}
      - action: timer.cancel
        target:
          entity_id: [timer.alarm_homy_salida, timer.alarm_homy_entrada]
      - action: input_select.select_option
        target: {entity_id: input_select.alarm_homy_estado}
        data: {option: triggered}
      - action: timer.start
        target: {entity_id: timer.alarm_homy_disparo}
        data: {duration: "{{ duracion }}"}

  # ---------------------------------------------------------------------------
  # PÁNICO: dispara desde cualquier estado (silencioso o sonoro)
  # ---------------------------------------------------------------------------
  alarm_homy_panico:
    alias: Alarm HOMY · Pánico
    icon: mdi:alarm-light-outline
    mode: single
    fields:
      tipo:
        default: panico_silencioso
        selector:
          select:
            options: [panico_silencioso, panico_sonoro]
      origen:
        selector:
          text:
    sequence:
      - action: input_select.select_option
        target: {entity_id: input_select.alarm_homy_tipo_disparo}
        data: {option: "{{ tipo | default('panico_silencioso') }}"}
      - event: alarm_homy_registrar_disparo
        event_data:
          sensores: [panico]
          origen: "{{ origen | default('desconocido') }}"
      - action: script.alarm_homy_disparar

automation:
  # ---------------------------------------------------------------------------
  # DETECCIÓN: nuevo sensor activo → entrada (pending) o disparo inmediato
  # ---------------------------------------------------------------------------
  - id: alarm_homy_deteccion
    alias: Alarm HOMY · Detección
    mode: queued
    max: 20
    triggers:
      - trigger: state
        entity_id: sensor.alarm_homy_activos
        attribute: entidades
    variables:
      antes: "{{ trigger.from_state.attributes.entidades if trigger.from_state else [] }}"
      ahora: "{{ trigger.to_state.attributes.entidades or [] }}"
      nuevos: "{{ ahora | reject('in', antes) | list }}"
      estado: "{{ states('input_select.alarm_homy_estado') }}"
      modo: "{{ states('input_select.alarm_homy_modo') }}"
      inmediato: "{{ nuevos | select('in', label_entities('alarm_homy_inmediato')) | list | count > 0 }}"
      txt: >-
        {% from 'alarm_homy.jinja' import texto_modo %}{{ texto_modo(modo) }}
      entrada: "{{ states('input_number.alarm_homy_' ~ txt ~ '_entrada') | int(0) }}"
    conditions:
      - condition: template
        value_template: "{{ nuevos | count > 0 and estado in ['armed_away', 'armed_home', 'armed_night', 'armed_vacation', 'pending', 'triggered'] }}"
    actions:
      - event: alarm_homy_registrar_disparo
        event_data:
          sensores: "{{ nuevos }}"
          origen: sensor
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ estado == 'triggered' }}"
            sequence: []   # ya disparada: solo se registra el sensor
          - conditions:
              - condition: template
                value_template: "{{ inmediato or entrada == 0 }}"
            sequence:
              - action: script.alarm_homy_disparar
          - conditions:
              - condition: template
                value_template: "{{ estado != 'pending' }}"
            sequence:
              - action: input_select.select_option
                target: {entity_id: input_select.alarm_homy_estado}
                data: {option: pending}
              - action: timer.start
                target: {entity_id: timer.alarm_homy_entrada}
                data: {duration: "{{ entrada }}"}

  # ---------------------------------------------------------------------------
  # FIN DE TIEMPOS: salida → armada · entrada → disparo · disparo → vuelve al modo
  # ---------------------------------------------------------------------------
  - id: alarm_homy_timers
    alias: Alarm HOMY · Fin de tiempos
    mode: queued
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data: {entity_id: timer.alarm_homy_salida}
        id: salida
      - trigger: event
        event_type: timer.finished
        event_data: {entity_id: timer.alarm_homy_entrada}
        id: entrada
      - trigger: event
        event_type: timer.finished
        event_data: {entity_id: timer.alarm_homy_disparo}
        id: disparo
    actions:
      - variables:
          estado: "{{ states('input_select.alarm_homy_estado') }}"
          modo: "{{ states('input_select.alarm_homy_modo') }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'salida' and estado == 'arming' }}"
            sequence:
              - action: input_select.select_option
                target: {entity_id: input_select.alarm_homy_estado}
                data: {option: "{{ modo }}"}
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'entrada' and estado == 'pending' }}"
            sequence:
              - action: script.alarm_homy_disparar
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'disparo' and estado == 'triggered' }}"
            sequence:
              - action: input_select.select_option
                target: {entity_id: input_select.alarm_homy_tipo_disparo}
                data: {option: normal}
              - action: input_select.select_option
                target: {entity_id: input_select.alarm_homy_estado}
                data: {option: "{{ modo }}"}

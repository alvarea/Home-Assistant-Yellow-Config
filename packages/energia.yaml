###############################################################################
#  ENERGÍA · Precio actual de la luz (2026-10-15)
#
#  Tarifa Octopus Go (2.0TD), precio fijo. Doc: claude/tarifa-octopus.md
#    Valle (P3): 0,067 €/kWh  → 00:00-08:00 laborables y 24 h sábados, domingos
#                              y festivos nacionales.
#    Punta/llano (P1=P2): 0,211 €/kWh → resto.
#  Impuestos: impuesto eléctrico 5,11 % + IVA 21 % → factor 1,0511 × 1,21 = 1,2719.
#  Festivos: binary_sensor.workday_sensor (integración Workday, país ES, sin
#  provincia → solo festivos nacionales). Si no está disponible, solo fines de semana.
#  Contrato hasta 29-01-2027: revisar precios entonces.
###############################################################################

template:
  - sensor:
      - name: precio_luz_actual
        unique_id: precio_luz_actual
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:cash-clock
        state: >-
          {%- set valle, resto, impuestos = 0.067, 0.211, 1.0511 * 1.21 -%}
          {%- set wd = states('binary_sensor.workday_sensor') -%}
          {%- set laborable = (wd == 'on') if wd in ['on', 'off'] else (now().isoweekday() <= 5) -%}
          {%- set es_valle = (not laborable) or now().hour < 8 -%}
          {{ ((valle if es_valle else resto) * impuestos) | round(4) }}
        attributes:
          periodo: >-
            {%- set wd = states('binary_sensor.workday_sensor') -%}
            {%- set laborable = (wd == 'on') if wd in ['on', 'off'] else (now().isoweekday() <= 5) -%}
            {{ 'valle' if (not laborable) or now().hour < 8 else 'punta_llano' }}
          precio_sin_impuestos: >-
            {%- set wd = states('binary_sensor.workday_sensor') -%}
            {%- set laborable = (wd == 'on') if wd in ['on', 'off'] else (now().isoweekday() <= 5) -%}
            {{ 0.067 if (not laborable) or now().hour < 8 else 0.211 }}
          tarifa: Octopus Go

      # Potencia contratada vigente (factura sep-2026): P1 4,6 kW (punta/llano), P2 5,7 kW (valle).
      # Consumo de la casa = consumo general (pinza) - consumo del coche (Trydan), mínimo 0.
      # Vocabulario: general = casa + coche. Si algún día hay pinza propia del circuito casa
      # (ENE-13/15) se sustituye esta medida por la real.
      - name: casa_potencia
        unique_id: casa_potencia
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:home-lightning-bolt
        availability: "{{ has_value('sensor.v2c_house_power') and has_value('sensor.v2c_charge_power') }}"
        state: "{{ [states('sensor.v2c_house_power') | float(0) - states('sensor.v2c_charge_power') | float(0), 0] | max | round(0) }}"
      - name: potencia_contratada_actual
        unique_id: potencia_contratada_actual
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        icon: mdi:flash-triangle
        availability: "{{ state_attr('sensor.precio_luz_actual', 'periodo') in ['valle', 'punta_llano'] }}"
        state: >-
          {{ 5.7 if state_attr('sensor.precio_luz_actual', 'periodo') == 'valle' else 4.6 }}

  # ENE-06 · Coste (tarifa Octopus Go con impuestos, mismos precios que precio_luz_actual).
  # Coste = kWh del utility_meter por tarifa × precio. Sin state_class: se reinicia cada ciclo
  # y el histórico largo está en las estadísticas de los kWh.
  - sensor:
      # ENE-18 · Periodo de facturación 2.0TD para mostrar en el dashboard: Valle (00-08 h laborables y
      # fines de semana/festivos), Punta (10-14 y 18-22 h laborables) y Llano (resto). Octopus Go cobra
      # igual punta y llano (ver precio_luz_actual: periodo valle | punta_llano); este sensor es informativo.
      - name: periodo_luz_actual
        unique_id: periodo_luz_actual
        state: >-
          {%- set wd = states('binary_sensor.workday_sensor') -%}
          {%- set laborable = (wd == 'on') if wd in ['on', 'off'] else (now().isoweekday() <= 5) -%}
          {%- set h = now().hour -%}
          {%- if (not laborable) or h < 8 -%}Valle{%- elif h in [10, 11, 12, 13, 18, 19, 20, 21] -%}Punta{%- else -%}Llano{%- endif -%}
        icon: >-
          {%- set wd = states('binary_sensor.workday_sensor') -%}
          {%- set laborable = (wd == 'on') if wd in ['on', 'off'] else (now().isoweekday() <= 5) -%}
          {%- set h = now().hour -%}
          {%- if (not laborable) or h < 8 -%}mdi:weather-night{%- elif h in [10, 11, 12, 13, 18, 19, 20, 21] -%}mdi:flash-alert{%- else -%}mdi:flash-outline{%- endif -%}
      - name: precio_luz_valle
        unique_id: precio_luz_valle
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:cash-minus
        state: "{{ (0.067 * 1.0511 * 1.21) | round(4) }}"
      - name: precio_luz_punta_llano
        unique_id: precio_luz_punta_llano
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:cash-plus
        state: "{{ (0.211 * 1.0511 * 1.21) | round(4) }}"
      - name: coste_general_hoy_valle
        unique_id: coste_general_hoy_valle
        unit_of_measurement: EUR
        device_class: monetary
        icon: mdi:home-lightning-bolt
        availability: "{{ has_value('sensor.precio_luz_valle') and has_value('sensor.precio_luz_punta_llano') }}"
        state: "{{ (states('sensor.general_energia_red_diario_valle') | float(0) * states('sensor.precio_luz_valle') | float(0)) | round(2) }}"
      - name: coste_general_hoy_punta_llano
        unique_id: coste_general_hoy_punta_llano
        unit_of_measurement: EUR
        device_class: monetary
        icon: mdi:home-lightning-bolt
        availability: "{{ has_value('sensor.precio_luz_valle') and has_value('sensor.precio_luz_punta_llano') }}"
        state: "{{ (states('sensor.general_energia_red_diario_punta_llano') | float(0) * states('sensor.precio_luz_punta_llano') | float(0)) | round(2) }}"
      - name: coste_general_hoy
        unique_id: coste_general_hoy
        unit_of_measurement: EUR
        device_class: monetary
        icon: mdi:home-lightning-bolt
        availability: "{{ has_value('sensor.precio_luz_valle') and has_value('sensor.precio_luz_punta_llano') }}"
        state: "{{ ((states('sensor.general_energia_red_diario_valle') | float(0) * states('sensor.precio_luz_valle') | float(0)) + (states('sensor.general_energia_red_diario_punta_llano') | float(0) * states('sensor.precio_luz_punta_llano') | float(0))) | round(2) }}"
      - name: coste_general_mes_valle
        unique_id: coste_general_mes_valle
        unit_of_measurement: EUR
        device_class: monetary
        icon: mdi:home-lightning-bolt
        availability: "{{ has_value('sensor.precio_luz_valle') and has_value('sensor.precio_luz_punta_llano') }}"
        state: "{{ (states('sensor.general_energia_red_mensual_valle') | float(0) * states('sensor.precio_luz_valle') | float(0)) | round(2) }}"
      - name: coste_general_mes_punta_llano
        unique_id: coste_general_mes_punta_llano
        unit_of_measurement: EUR
        device_class: monetary
        icon: mdi:home-lightning-bolt
        availability: "{{ has_value('sensor.precio_luz_valle') and has_value('sensor.precio_luz_punta_llano') }}"
        state: "{{ (states('sensor.general_energia_red_mensual_punta_llano') | float(0) * states('sensor.precio_luz_punta_llano') | float(0)) | round(2) }}"
      - name: coste_general_mes
        unique_id: coste_general_mes
        unit_of_measurement: EUR
        device_class: monetary
        icon: mdi:home-lightning-bolt
        availability: "{{ has_value('sensor.precio_luz_valle') and has_value('sensor.precio_luz_punta_llano') }}"
        state: "{{ ((states('sensor.general_energia_red_mensual_valle') | float(0) * states('sensor.precio_luz_valle') | float(0)) + (states('sensor.general_energia_red_mensual_punta_llano') | float(0) * states('sensor.precio_luz_punta_llano') | float(0))) | round(2) }}"
      - name: coste_ve_hoy_valle
        unique_id: coste_ve_hoy_valle
        unit_of_measurement: EUR
        device_class: monetary
        icon: mdi:ev-station
        availability: "{{ has_value('sensor.precio_luz_valle') and has_value('sensor.precio_luz_punta_llano') }}"
        state: "{{ (states('sensor.ve_energia_diario_valle') | float(0) * states('sensor.precio_luz_valle') | float(0)) | round(2) }}"
      - name: coste_ve_hoy_punta_llano
        unique_id: coste_ve_hoy_punta_llano
        unit_of_measurement: EUR
        device_class: monetary
        icon: mdi:ev-station
        availability: "{{ has_value('sensor.precio_luz_valle') and has_value('sensor.precio_luz_punta_llano') }}"
        state: "{{ (states('sensor.ve_energia_diario_punta_llano') | float(0) * states('sensor.precio_luz_punta_llano') | float(0)) | round(2) }}"
      - name: coste_ve_hoy
        unique_id: coste_ve_hoy
        unit_of_measurement: EUR
        device_class: monetary
        icon: mdi:ev-station
        availability: "{{ has_value('sensor.precio_luz_valle') and has_value('sensor.precio_luz_punta_llano') }}"
        state: "{{ ((states('sensor.ve_energia_diario_valle') | float(0) * states('sensor.precio_luz_valle') | float(0)) + (states('sensor.ve_energia_diario_punta_llano') | float(0) * states('sensor.precio_luz_punta_llano') | float(0))) | round(2) }}"
      - name: coste_ve_mes_valle
        unique_id: coste_ve_mes_valle
        unit_of_measurement: EUR
        device_class: monetary
        icon: mdi:ev-station
        availability: "{{ has_value('sensor.precio_luz_valle') and has_value('sensor.precio_luz_punta_llano') }}"
        state: "{{ (states('sensor.ve_energia_mensual_valle') | float(0) * states('sensor.precio_luz_valle') | float(0)) | round(2) }}"
      - name: coste_ve_mes_punta_llano
        unique_id: coste_ve_mes_punta_llano
        unit_of_measurement: EUR
        device_class: monetary
        icon: mdi:ev-station
        availability: "{{ has_value('sensor.precio_luz_valle') and has_value('sensor.precio_luz_punta_llano') }}"
        state: "{{ (states('sensor.ve_energia_mensual_punta_llano') | float(0) * states('sensor.precio_luz_punta_llano') | float(0)) | round(2) }}"
      - name: coste_ve_mes
        unique_id: coste_ve_mes
        unit_of_measurement: EUR
        device_class: monetary
        icon: mdi:ev-station
        availability: "{{ has_value('sensor.precio_luz_valle') and has_value('sensor.precio_luz_punta_llano') }}"
        state: "{{ ((states('sensor.ve_energia_mensual_valle') | float(0) * states('sensor.precio_luz_valle') | float(0)) + (states('sensor.ve_energia_mensual_punta_llano') | float(0) * states('sensor.precio_luz_punta_llano') | float(0))) | round(2) }}"

  # ENE-18 · Totales para el resumen de la Home View (los utility_meter con tarifas solo crean
  # sensores _valle y _punta_llano). Sin state_class: se reinician cada ciclo; el histórico largo
  # está en las estadísticas de los medidores.
  - sensor:
      - name: general_energia_hoy
        unique_id: general_energia_hoy
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:lightning-bolt
        state: "{{ (states('sensor.general_energia_red_diario_valle') | float(0) + states('sensor.general_energia_red_diario_punta_llano') | float(0)) | round(3) }}"
      - name: general_energia_mes
        unique_id: general_energia_mes
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:lightning-bolt
        state: "{{ (states('sensor.general_energia_red_mensual_valle') | float(0) + states('sensor.general_energia_red_mensual_punta_llano') | float(0)) | round(3) }}"
      - name: ve_energia_hoy
        unique_id: ve_energia_hoy
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:ev-station
        state: "{{ (states('sensor.ve_energia_diario_valle') | float(0) + states('sensor.ve_energia_diario_punta_llano') | float(0)) | round(3) }}"
      - name: ve_energia_mes
        unique_id: ve_energia_mes
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:ev-station
        state: "{{ (states('sensor.ve_energia_mensual_valle') | float(0) + states('sensor.ve_energia_mensual_punta_llano') | float(0)) | round(3) }}"
      # % del límite vigente que consume la casa (sin coche): mismo criterio que el aviso de ENE-17.
      - name: casa_potencia_pct_limite
        unique_id: casa_potencia_pct_limite
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:gauge
        availability: "{{ has_value('sensor.casa_potencia') and has_value('sensor.potencia_contratada_actual') }}"
        state: "{{ (states('sensor.casa_potencia') | float(0) / (states('sensor.potencia_contratada_actual') | float(1) * 10)) | round(0) }}"

  # ENE-25 · kWh y coste (EUR) de hoy y del mes por aparato. Sin state_class: se reinician cada ciclo.
  - sensor:
      - name: lavadora_energia_hoy
        unique_id: lavadora_energia_hoy
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:washing-machine
        state: "{{ (states('sensor.lavadora_energia_diario_valle') | float(0) + states('sensor.lavadora_energia_diario_punta_llano') | float(0)) | round(3) }}"
      - name: coste_lavadora_hoy
        unique_id: coste_lavadora_hoy
        unit_of_measurement: EUR
        device_class: monetary
        icon: mdi:washing-machine
        availability: "{{ has_value('sensor.precio_luz_valle') and has_value('sensor.precio_luz_punta_llano') }}"
        state: "{{ ((states('sensor.lavadora_energia_diario_valle') | float(0) * states('sensor.precio_luz_valle') | float(0)) + (states('sensor.lavadora_energia_diario_punta_llano') | float(0) * states('sensor.precio_luz_punta_llano') | float(0))) | round(2) }}"
      - name: lavadora_energia_mes
        unique_id: lavadora_energia_mes
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:washing-machine
        state: "{{ (states('sensor.lavadora_energia_mensual_valle') | float(0) + states('sensor.lavadora_energia_mensual_punta_llano') | float(0)) | round(3) }}"
      - name: coste_lavadora_mes
        unique_id: coste_lavadora_mes
        unit_of_measurement: EUR
        device_class: monetary
        icon: mdi:washing-machine
        availability: "{{ has_value('sensor.precio_luz_valle') and has_value('sensor.precio_luz_punta_llano') }}"
        state: "{{ ((states('sensor.lavadora_energia_mensual_valle') | float(0) * states('sensor.precio_luz_valle') | float(0)) + (states('sensor.lavadora_energia_mensual_punta_llano') | float(0) * states('sensor.precio_luz_punta_llano') | float(0))) | round(2) }}"
      - name: pozo_energia_hoy
        unique_id: pozo_energia_hoy
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:water-pump
        state: "{{ (states('sensor.pozo_energia_diario_valle') | float(0) + states('sensor.pozo_energia_diario_punta_llano') | float(0)) | round(3) }}"
      - name: coste_pozo_hoy
        unique_id: coste_pozo_hoy
        unit_of_measurement: EUR
        device_class: monetary
        icon: mdi:water-pump
        availability: "{{ has_value('sensor.precio_luz_valle') and has_value('sensor.precio_luz_punta_llano') }}"
        state: "{{ ((states('sensor.pozo_energia_diario_valle') | float(0) * states('sensor.precio_luz_valle') | float(0)) + (states('sensor.pozo_energia_diario_punta_llano') | float(0) * states('sensor.precio_luz_punta_llano') | float(0))) | round(2) }}"
      - name: pozo_energia_mes
        unique_id: pozo_energia_mes
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:water-pump
        state: "{{ (states('sensor.pozo_energia_mensual_valle') | float(0) + states('sensor.pozo_energia_mensual_punta_llano') | float(0)) | round(3) }}"
      - name: coste_pozo_mes
        unique_id: coste_pozo_mes
        unit_of_measurement: EUR
        device_class: monetary
        icon: mdi:water-pump
        availability: "{{ has_value('sensor.precio_luz_valle') and has_value('sensor.precio_luz_punta_llano') }}"
        state: "{{ ((states('sensor.pozo_energia_mensual_valle') | float(0) * states('sensor.precio_luz_valle') | float(0)) + (states('sensor.pozo_energia_mensual_punta_llano') | float(0) * states('sensor.precio_luz_punta_llano') | float(0))) | round(2) }}"

###############################################################################
#  ENERGÍA · Consumo de red (ENE-02, 2026-10-21)
#
#  Integra la potencia de la pinza del V2C (interruptor general del cuadro
#  principal = consumo total de la vivienda, coche incluido) → kWh para el
#  panel de Energía. Acumula desde su creación: el histórico anterior no se
#  convierte. Método 'left' (la potencia constante se integra bien) y
#  max_sub_interval para que siga sumando aunque la pinza no cambie de valor.
###############################################################################

sensor:
  - platform: integration
    source: sensor.v2c_house_power
    name: general_energia_red
    unique_id: general_energia_red
    unit_prefix: k
    unit_time: h
    round: 3
    method: left
    max_sub_interval: "00:01:00"

  # ENE-25 · Energía por aparato (Riemann sobre su potencia). Se usa Riemann también para la lavadora
  # porque un utility_meter sobre un sensor de energía que no cambia se queda sin unidad hasta que cambie.
  - platform: integration
    source: sensor.grillplats_lavadora_power
    name: lavadora_energia
    unique_id: lavadora_energia
    unit_prefix: k
    unit_time: h
    round: 3
    method: left
    max_sub_interval: "00:01:00"
  - platform: integration
    source: sensor.esphome_pow_sw4_power
    name: pozo_energia
    unique_id: pozo_energia
    unit_prefix: k
    unit_time: h
    round: 3
    method: left
    max_sub_interval: "00:01:00"

###############################################################################
#  ENERGÍA · Contadores por ciclo y tarifa (ENE-03, 2026-10-21)
#
#  utility_meter diario / mensual / anual con las tarifas del atributo `periodo`
#  de sensor.precio_luz_actual (valle | punta_llano), para:
#    · el consumo general (sensor.general_energia_red, pinza V2C = casa + coche)
#    · el coche (sensor.v2c_charge_energy del Trydan: carga fuera de valle)
#  Cada medidor crea select.<nombre> (tarifa activa) y sensor.<nombre>_valle /
#  sensor.<nombre>_punta_llano. La automatización cambia la tarifa de los seis.
#  Acumulan desde su creación (sin histórico anterior).
###############################################################################

utility_meter:
  general_energia_red_diario:
    source: sensor.general_energia_red
    name: general_energia_red_diario
    cycle: daily
    tariffs: [valle, punta_llano]
  general_energia_red_mensual:
    source: sensor.general_energia_red
    name: general_energia_red_mensual
    cycle: monthly
    tariffs: [valle, punta_llano]
  general_energia_red_anual:
    source: sensor.general_energia_red
    name: general_energia_red_anual
    cycle: yearly
    tariffs: [valle, punta_llano]
  ve_energia_diario:
    source: sensor.v2c_charge_energy
    name: ve_energia_diario
    cycle: daily
    tariffs: [valle, punta_llano]
  ve_energia_mensual:
    source: sensor.v2c_charge_energy
    name: ve_energia_mensual
    cycle: monthly
    tariffs: [valle, punta_llano]
  ve_energia_anual:
    source: sensor.v2c_charge_energy
    name: ve_energia_anual
    cycle: yearly
    tariffs: [valle, punta_llano]

  # ENE-25 · lavadora y pozo (diario y mensual)
  lavadora_energia_diario:
    source: sensor.lavadora_energia
    name: lavadora_energia_diario
    cycle: daily
    tariffs: [valle, punta_llano]
  lavadora_energia_mensual:
    source: sensor.lavadora_energia
    name: lavadora_energia_mensual
    cycle: monthly
    tariffs: [valle, punta_llano]
  pozo_energia_diario:
    source: sensor.pozo_energia
    name: pozo_energia_diario
    cycle: daily
    tariffs: [valle, punta_llano]
  pozo_energia_mensual:
    source: sensor.pozo_energia
    name: pozo_energia_mensual
    cycle: monthly
    tariffs: [valle, punta_llano]

###############################################################################
#  ENERGÍA · Ancla del registro de excesos de potencia (ENE-20/22)
#  Entidad sin uso funcional: solo sirve para que el Logbook pueda filtrar por ella
#  las entradas que escribe la automatización de aviso de potencia.
###############################################################################

input_boolean:
  energia_registro_potencia:
    name: energia_registro_potencia
    icon: mdi:flash-alert

automation:
  - id: energia_tarifa_utility_meter
    alias: Energía · Tarifa de los contadores según periodo
    description: Pone valle o punta_llano en los selects de los utility_meter (general, VE, lavadora y pozo) al cambiar el periodo de sensor.precio_luz_actual y al arrancar HA.
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.precio_luz_actual
        attribute: periodo
      - trigger: homeassistant
        event: start
    conditions:
      - "{{ state_attr('sensor.precio_luz_actual', 'periodo') in ['valle', 'punta_llano'] }}"
    actions:
      - action: select.select_option
        target:
          entity_id:
            - select.general_energia_red_diario
            - select.general_energia_red_mensual
            - select.general_energia_red_anual
            - select.ve_energia_diario
            - select.ve_energia_mensual
            - select.ve_energia_anual
            - select.lavadora_energia_diario
            - select.lavadora_energia_mensual
            - select.pozo_energia_diario
            - select.pozo_energia_mensual
        data:
          option: "{{ state_attr('sensor.precio_luz_actual', 'periodo') }}"

###############################################################################
#  ENERGÍA · Aviso de potencia contratada (ENE-08/17; ENE-20/21 · 2026-10-22)
#
#  FASE DE PRUEBAS: sin Alexa ni push. Cada exceso deja una entrada escueta en el
#  Logbook: pico en W y % sobre el límite vigente. Se asocia (logbook.log) a
#  input_boolean.energia_registro_potencia, una entidad ancla que nadie cambia, porque
#  HA no muestra en las vistas filtradas por entidad las entradas de sensores numéricos
#  (sensor.casa_potencia): la tarjeta logbook de la vista Energía filtra por el ancla.
#  Encendida el 22-10 por decisión de Agustín.
#
#  Vocabulario: general = pinza V2C (casa + coche) · casa = sensor.casa_potencia
#  (general - coche). Límite vigente: sensor.potencia_contratada_actual.
#    cerca     consumo CASA > 90 % del límite de forma CONTINUA durante 120 s
#              (cooldown 10 min).
#    superado  consumo GENERAL > 100 % del límite de forma CONTINUA durante 60 s
#              (cooldown 2 min).
#  Anti-falsos positivos (ENE-21): las cargas resistivas con termostato (vitro, horno…)
#  alternan 1,3-6,2 kW en segundos y el `for:` se reinicia en cada bajada. El historial
#  del 22-10 (26 h, muestras de 5 s) muestra tramos continuos máximos de 60 s sobre el 90 %
#  y de 30 s sobre el 100 %; el `for:` elegido duplica esos máximos. Con estos parámetros
#  la ventana 19:00-19:10 UTC del 22-10 no habría disparado nada, y solo se habría
#  registrado el consumo estable del 21-10 22:44 (130 s a 4,3 kW, 93 %).
#  El valor registrado es el del momento de la detección (sostenido sobre el umbral).
###############################################################################

  - id: energia_aviso_potencia_contratada
    alias: Energía · Aviso de potencia contratada
    description: "Fase de pruebas: registra en el Logbook (sin Alexa ni push) cuando el consumo de la casa supera el 90 % (120 s seguidos) o el general el 100 % (60 s seguidos) de la potencia contratada vigente. Apagada hasta decisión de Agustín."
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: template
        id: cerca
        value_template: "{{ states('sensor.casa_potencia') | float(0) > 900 * (states('sensor.potencia_contratada_actual') | float(99)) }}"
        for: {seconds: 120}
      - trigger: template
        id: superado
        value_template: "{{ states('sensor.v2c_house_power') | float(0) > 1000 * (states('sensor.potencia_contratada_actual') | float(99)) }}"
        for: {seconds: 60}
    conditions:
      - "{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > (120 if trigger.id == 'superado' else 600) }}"
    actions:
      - variables:
          pico: "{{ (states('sensor.v2c_house_power') if trigger.id == 'superado' else states('sensor.casa_potencia')) | float(0) | round(0) | int }}"
          lim_w: "{{ (states('sensor.potencia_contratada_actual') | float(0) * 1000) | round(0) | int }}"
          pct: "{{ (pico / lim_w * 100) | round(0) | int if lim_w > 0 else 0 }}"
      - action: logbook.log
        data:
          name: Potencia contratada
          message: "{{ 'Superado' if trigger.id == 'superado' else 'Cerca' }}: {{ pico }} W · {{ pct }} % del límite ({{ (lim_w / 1000) | string | replace('.', ',') }} kW)"
          entity_id: input_boolean.energia_registro_potencia

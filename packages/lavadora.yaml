###############################################################################
#  LAVADORA BOSCH · Apagado automático al terminar y aviso de tendido (2026-10-12)
#
#  Enchufe Matter IKEA GRILLPLATS en el lavadero (área Cocina), encima de la lavadora.
#  La Bosch pita al terminar hasta que se gira el mando; HA corta el enchufe ~45 s
#  después del fin (~90 s en programas cortos). NUNCA se re-enciende solo: al
#  volver la corriente con el mando en un programa la Bosch vuelve a pitar. Re-encendido: botón físico del enchufe
#  o "Alexa, enciende la lavadora" (con el mando en off).
#
#  Entidades del enchufe (renombradas de grillplats_plug_* a grillplats_lavadora_*):
#    switch.grillplats_lavadora · sensor.grillplats_lavadora_power · _energy · _active_current …
#  switch.lavadora     → interruptor protegido expuesto a Alexa: no apaga durante un lavado.
#  sensor.lavadora_estado → apagada | lavando | terminada (+ atributos del lavado).
#
#  Detección (análisis del 11/12-10): calentamiento ~2,2 kW, lavado/aclarado a
#  impulsos 170-300 W con pausas < 8 W de 29 s como máximo; terminado = 1,9-2,7 W
#  (pitido); 0 W = mando girado.
#    lavando:   > 20 W durante 30 s
#    terminada: tras >= 20 min lavando, < 5 W durante 45 s (15-10: con 90 s la
#               Bosch ya pitaba; pita ~20 s después del último pulso de desagüe)
#               o, tras >= 5 min, < 5 W durante 90 s (LAV-09: programas cortos de
#               ~10-12 min, 28-10; pausas internas < 5 W de 11 s como máximo).
#               Dos ventanas porque numeric_state solo dispara al cruzar: si 'fin'
#               se descarta por duración, el pitido no vuelve a cruzar los 5 W.
#  Calentamiento y tipo (LAV-06, histórico 15/29-10): tramos > 1 kW acumulados →
#    tipo_lavado frio (< 1 min) | tibio (< 4) | templado (≤ 13, ~40 °C) | caliente;
#    calento = calentó ≥ 1 min. En vivo durante el lavado y ultimo_* al terminar:
#    es la interfaz para LAV-07 (pulsador para declarar el tipo). Fin estimado =
#    mediana de los últimos 5 lavados del tipo en curso (frío/40 °C ~62 min,
#    caliente ~89 min); los programas cortos (< 20 min) no se aprenden.
#  Tendido: previsión horaria AEMET; ventana desde el fin hasta la próxima puesta
#  de sol (de noche incluye la noche y el día siguiente). Secadora si alguna
#  hora > 50 % de probabilidad de lluvia. Si la horaria no devuelve horas (LAV-05),
#  respaldo con la diaria: máximo de los días que cubre la ventana.
#  Spec y backlog de mejoras: doc del proyecto claude/lavadora-bosch-2026-10-12.md
###############################################################################

# counter.lavadora_lavados_mes: helper de UI (counter.reload no disponible → evita reinicio)

template:
  # ---------------------------------------------------------------------------
  # ESTADO DEL LAVADO (trigger-based: se restaura tras reinicio)
  # ---------------------------------------------------------------------------
  - triggers:
      - trigger: numeric_state
        entity_id: sensor.grillplats_lavadora_power
        above: 20
        for: "00:00:30"
        id: inicio
      - trigger: numeric_state
        entity_id: sensor.grillplats_lavadora_power
        below: 5
        for: "00:00:45"
        id: fin
      # Programas cortos: misma bajada, 45 s más tarde (ventana más larga contra pausas manuales)
      - trigger: numeric_state
        entity_id: sensor.grillplats_lavadora_power
        below: 5
        for: "00:01:30"
        id: fin_corto
      # Tramos de calentamiento (resistencia ~2 kW; el motor no pasa de ~340 W)
      - trigger: numeric_state
        entity_id: sensor.grillplats_lavadora_power
        above: 1000
        id: calor_on
      - trigger: numeric_state
        entity_id: sensor.grillplats_lavadora_power
        below: 1000
        id: calor_off
      - trigger: numeric_state
        entity_id: sensor.grillplats_lavadora_power
        below: 0.5
        for: "00:00:30"
        id: mando_off
      - trigger: state
        entity_id: switch.grillplats_lavadora
        to: "off"
        for: "00:02:00"
        id: enchufe_off
      - trigger: state
        entity_id: switch.grillplats_lavadora
        from: "off"
        to: "on"
        id: enchufe_on
      # Coste acumulado: cada incremento de energía al precio vigente (packages/energia.yaml)
      - trigger: state
        entity_id: sensor.grillplats_lavadora_energy
        id: energia
      # Inicialización tras arranque o recarga de plantillas (deja 'apagada' si no hay estado)
      - trigger: homeassistant
        event: start
        id: init
      - trigger: event
        event_type: event_template_reloaded
        id: init
    actions:
      - action: weather.get_forecasts
        target: {entity_id: weather.aemet}
        data: {type: hourly}
        response_variable: prevision
        continue_on_error: true
      # Respaldo (LAV-05): el 23-10 la horaria no devolvió horas en tres lavados seguidos
      - action: weather.get_forecasts
        target: {entity_id: weather.aemet}
        data: {type: daily}
        response_variable: prevision_dia
        continue_on_error: true
      - variables:
          ent: sensor.lavadora_estado
          e: "{{ states(ent) if states(ent) in ['apagada', 'lavando', 'terminada'] else 'apagada' }}"
          t: "{{ trigger.id }}"
          ini: "{{ state_attr(ent, 'inicio') }}"
          seg: "{{ (now() - as_datetime(ini)).total_seconds() if ini else 0 }}"
          energia: "{{ states('sensor.grillplats_lavadora_energy') | float(0) }}"
          nuevo: >-
            {%- if t == 'inicio' -%}lavando
            {%- elif t == 'fin' and e == 'lavando' and seg >= 1200 -%}terminada
            {%- elif t == 'fin_corto' and e == 'lavando' and seg >= 300 -%}terminada
            {%- elif t == 'mando_off' and e == 'lavando' and is_state('switch.grillplats_lavadora', 'on') -%}apagada
            {%- elif t == 'enchufe_off' and e == 'lavando' -%}apagada
            {%- elif t == 'enchufe_on' and e == 'terminada' -%}apagada
            {%- else -%}{{ e }}{%- endif -%}
          empieza: "{{ nuevo == 'lavando' and e != 'lavando' }}"
          delta_kwh: >-
            {%- if t == 'energia' and e == 'lavando' and trigger.from_state is not none -%}
              {{ [trigger.to_state.state | float(0) - trigger.from_state.state | float(0), 0] | max }}
            {%- else -%}0{%- endif -%}
          coste: >-
            {%- set base = 0 if empieza else state_attr(ent, 'coste') | float(0) -%}
            {{ (base + delta_kwh * states('sensor.precio_luz_actual') | float(0.2684)) | round(4) }}
          termina: "{{ nuevo == 'terminada' and e == 'lavando' }}"
          # Calentamiento (LAV-06): tramos > 1 kW acumulados. Empieza a los ~20 s del
          # lavado o incluso antes de 'lavando' (el arranque tarda 30 s): si al empezar
          # ya calienta, el tramo abre ahí.
          calentando: "{{ states('sensor.grillplats_lavadora_power') | float(0) > 1000 }}"
          c_desde_prev: "{{ none if empieza else state_attr(ent, 'calor_desde') }}"
          c_kwh_desde_prev: "{{ state_attr(ent, 'calor_kwh_desde') | float(energia) }}"
          abre: "{{ (empieza and calentando) or (t == 'calor_on' and e == 'lavando' and not c_desde_prev) }}"
          cierra: >-
            {{ c_desde_prev is not none and (t == 'calor_off' or termina or (nuevo == 'apagada' and e == 'lavando')) }}
          c_seg: >-
            {%- set base = 0 if empieza else state_attr(ent, 'seg_calentamiento') | float(0) -%}
            {{ (base + ((now() - as_datetime(c_desde_prev)).total_seconds() if cierra else 0)) | round(0) }}
          c_kwh: >-
            {%- set base = 0 if empieza else state_attr(ent, 'kwh_calentamiento') | float(0) -%}
            {{ (base + ([energia - c_kwh_desde_prev, 0] | max if cierra else 0)) | round(3) }}
          c_desde: "{{ now().isoformat() if abre else (none if cierra else c_desde_prev) }}"
          c_kwh_desde: "{{ energia if abre else c_kwh_desde_prev }}"
          # Con el tramo abierto, los minutos cuentan en vivo (tipo y fin estimado se actualizan)
          c_min: >-
            {{ ((c_seg + ((now() - as_datetime(c_desde)).total_seconds() if c_desde else 0)) / 60) | round(1) }}
          # Tipo inferido (histórico 15/29-10): 0 min frío · ~2 min tibio · 7-10 min ~40 °C · 17-26 min caliente
          tipo: >-
            {%- if c_min < 1 -%}frio{%- elif c_min < 4 -%}tibio{%- elif c_min <= 13 -%}templado{%- else -%}caliente{%- endif -%}
          # Duraciones (min) de los últimos 5 lavados completos por tipo; la estimación usa
          # la mediana del tipo en curso. Los programas cortos (< 20 min) no se aprenden.
          dur_prev: "{{ state_attr(ent, 'duraciones_tipo') or {'frio': [62], 'tibio': [62], 'templado': [62], 'caliente': [89]} }}"
          duraciones_tipo: >-
            {%- set ns = namespace(o=[]) -%}
            {%- for k, d in [('frio', 62), ('tibio', 62), ('templado', 62), ('caliente', 89)] -%}
              {%- set l = dur_prev.get(k) or [d] -%}
              {%- if termina and seg >= 1200 and k == tipo -%}{%- set l = (l + [(seg / 60) | round(0) | int])[-5:] -%}{%- endif -%}
              {%- set ns.o = ns.o + ['"' ~ k ~ '": ' ~ (l | to_json)] -%}
            {%- endfor -%}
            {{ '{' ~ ns.o | join(', ') ~ '}' }}
          dur_est: >-
            {%- set l = duraciones_tipo[tipo] | sort -%}
            {{ l[(l | count) // 2] }}
          # Ventana de tendido: desde ahora hasta la próxima puesta de sol (de noche cubre
          # la noche y el día siguiente: se puede tender ya por la noche, 15-10)
          de_dia: "{{ is_state('sun.sun', 'above_horizon') }}"
          v_ini: "{{ now().timestamp() }}"
          v_fin: "{{ as_timestamp(state_attr('sun.sun', 'next_setting')) }}"
          probs: >-
            {%- set f = prevision['weather.aemet'].forecast if prevision is defined and 'weather.aemet' in prevision else [] -%}
            {%- set ns = namespace(l=[]) -%}
            {%- for h in f -%}
              {%- set ts = as_timestamp(h.datetime, 0) -%}
              {%- if ts + 3600 > v_ini and ts < v_fin -%}
                {%- set ns.l = ns.l + [h.precipitation_probability | int(0)] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.l }}
          # Respaldo: máximo de los días que toca la ventana (hoy → día de la próxima puesta de sol)
          probs_dia: >-
            {%- set f = prevision_dia['weather.aemet'].forecast if prevision_dia is defined and 'weather.aemet' in prevision_dia else [] -%}
            {%- set d_ini = now().date() -%}
            {%- set d_fin = as_local(as_datetime(state_attr('sun.sun', 'next_setting'))).date() -%}
            {%- set ns = namespace(l=[]) -%}
            {%- for d in f if d.precipitation_probability is number -%}
              {%- set dd = as_local(as_datetime(d.datetime)).date() -%}
              {%- if d_ini <= dd <= d_fin -%}{%- set ns.l = ns.l + [d.precipitation_probability | int] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.l }}
          fuente: "{{ 'horaria' if probs | count > 0 else ('diaria' if probs_dia | count > 0 else none) }}"
          prob: >-
            {{ probs | max if probs | count > 0 else (probs_dia | max if probs_dia | count > 0 else -1) }}
          cuando: >-
            {%- if de_dia -%}hoy
            {%- elif as_local(as_datetime(state_attr('sun.sun', 'next_rising'))).date() > now().date() -%}mañana
            {%- else -%}por la mañana{%- endif -%}
    sensor:
      - name: lavadora_estado
        unique_id: lavadora_estado
        icon: >-
          {{ {'lavando': 'mdi:washing-machine', 'terminada': 'mdi:tshirt-crew'}.get(nuevo, 'mdi:washing-machine-off') }}
        state: "{{ nuevo }}"
        attributes:
          # Lavado en curso
          inicio: "{{ now().isoformat() if empieza else ini }}"
          kwh_inicio: "{{ energia if empieza else state_attr(ent, 'kwh_inicio') }}"
          duraciones_tipo: "{{ duraciones_tipo }}"
          duracion_estimada: "{{ dur_est }}"
          # Calentamiento y tipo inferido del lavado en curso (interfaz para LAV-07)
          calor_desde: "{{ c_desde }}"
          calor_kwh_desde: "{{ c_kwh_desde }}"
          seg_calentamiento: "{{ c_seg }}"
          kwh_calentamiento: "{{ c_kwh }}"
          min_calentamiento: "{{ c_min }}"
          calento: "{{ c_min >= 1 }}"
          tipo_lavado: "{{ tipo }}"
          fin_estimado: >-
            {%- set i = now() if empieza else (as_datetime(ini) if ini else none) -%}
            {{ (i + timedelta(minutes=dur_est | int(63))).isoformat() if i else none }}
          # Último lavado completo
          ultimo_inicio: "{{ ini if termina else state_attr(ent, 'ultimo_inicio') }}"
          ultimo_fin: "{{ now().isoformat() if termina else state_attr(ent, 'ultimo_fin') }}"
          ultimo_duracion_min: "{{ (seg / 60) | round(0) | int if termina else state_attr(ent, 'ultimo_duracion_min') }}"
          ultimo_kwh: >-
            {{ (energia - state_attr(ent, 'kwh_inicio') | float(energia)) | round(3) if termina else state_attr(ent, 'ultimo_kwh') }}
          ultimo_tipo: "{{ tipo if termina else state_attr(ent, 'ultimo_tipo') }}"
          ultimo_calento: "{{ c_min >= 1 if termina else state_attr(ent, 'ultimo_calento') }}"
          ultimo_min_calentamiento: "{{ c_min if termina else state_attr(ent, 'ultimo_min_calentamiento') }}"
          ultimo_kwh_calentamiento: "{{ c_kwh if termina else state_attr(ent, 'ultimo_kwh_calentamiento') }}"
          destino: >-
            {%- if termina -%}{{ 'desconocido' if prob < 0 else ('secadora' if prob > 50 else 'fuera') }}
            {%- else -%}{{ state_attr(ent, 'destino') }}{%- endif -%}
          prob_lluvia: "{{ (prob if prob >= 0 else none) if termina else state_attr(ent, 'prob_lluvia') }}"
          fuente_prevision: "{{ fuente if termina else state_attr(ent, 'fuente_prevision') }}"
          tendido_cuando: "{{ cuando if termina else state_attr(ent, 'tendido_cuando') }}"
          # Coste (€ con impuestos) del lavado en curso y del último completo
          coste: "{{ coste }}"
          ultimo_coste: "{{ coste if termina else state_attr(ent, 'ultimo_coste') }}"

  # ---------------------------------------------------------------------------
  # INTERRUPTOR PROTEGIDO (expuesto a Alexa como "Lavadora")
  # Apagar durante un lavado no corta: responde por el Echo al que se habló.
  # ---------------------------------------------------------------------------
  - switch:
      - name: lavadora
        unique_id: lavadora_switch_protegido
        icon: mdi:washing-machine
        state: "{{ is_state('switch.grillplats_lavadora', 'on') }}"
        availability: "{{ has_value('switch.grillplats_lavadora') }}"
        turn_on:
          - action: switch.turn_on
            target: {entity_id: switch.grillplats_lavadora}
        turn_off:
          - if: "{{ is_state('sensor.lavadora_estado', 'lavando') }}"
            then:
              # Alexa Media actualiza last_called unos segundos después de la orden
              - delay: "00:00:03"
              - variables:
                  echo: >-
                    {%- set ns = namespace(e='entrada', ts=0) -%}
                    {%- for k in ['entrada', 'estudio', 'dormitorio', 'dormitorio_paf'] -%}
                      {%- set ts = state_attr('media_player.echo_alexa_' ~ k, 'last_called_timestamp') | int(0) -%}
                      {%- if ts > ns.ts and now().timestamp() * 1000 - ts < 60000 -%}
                        {%- set ns.e = k -%}{%- set ns.ts = ts -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.e }}
              - action: script.turn_on
                target: {entity_id: script.alexa_decir}
                data:
                  variables:
                    echos: ["{{ echo }}"]
                    tipo: anuncio
                    mensaje: "La lavadora está lavando, no la apago."
            else:
              - action: switch.turn_off
                target: {entity_id: switch.grillplats_lavadora}

automation:
  # ---------------------------------------------------------------------------
  # FIN DEL LAVADO: cortar (para el pitido) y avisar dónde tender
  # ---------------------------------------------------------------------------
  - id: lavadora_fin_lavado
    alias: Lavadora · Fin de lavado (cortar y avisar)
    description: Corta el enchufe al terminar y avisa por Alexa (8-23 h) e iOS (Agustín y Malen en casa) dónde tender.
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.lavadora_estado
        from: lavando
        to: terminada
    actions:
      - action: counter.increment
        target: {entity_id: counter.lavadora_lavados_mes}
      # Mando ya girado (0 W con el enchufe encendido): no pita, no se corta ni se avisa.
      # Si el enchufe ya está apagado (corte manual) se avisa igualmente.
      - if: "{{ is_state('switch.grillplats_lavadora', 'on') and states('sensor.grillplats_lavadora_power') | float(0) < 0.5 }}"
        then:
          - stop: Mando ya girado
      - if: "{{ is_state('switch.grillplats_lavadora', 'on') }}"
        then:
          - action: switch.turn_off
            target: {entity_id: switch.grillplats_lavadora}
      - variables:
          a: sensor.lavadora_estado
          destino: "{{ state_attr(a, 'destino') }}"
          cuando: "{{ state_attr(a, 'tendido_cuando') }}"
          lavado: >-
            {{ {'frio': 'El lavado en frío', 'tibio': 'El lavado con agua tibia', 'templado': 'El lavado a unos 40 grados',
                'caliente': 'El lavado con agua caliente'}.get(state_attr(a, 'ultimo_tipo'), 'El lavado') }}
          mensaje: >-
            {%- if destino == 'desconocido' -%}{{ lavado }} ha terminado. No tengo la previsión del tiempo.
            {%- elif destino == 'fuera' -%}{{ lavado }} ha terminado, se puede tender la ropa fuera.
            {%- else -%}{{ lavado }} ha terminado, mejor usar la secadora: se esperan lluvias.
            {%- endif -%}
            {%- set dur = state_attr(a, 'ultimo_duracion_min') | int(0) -%}
            {%- set kwh = state_attr(a, 'ultimo_kwh') | float(0) -%}
            {%- set eur = state_attr(a, 'ultimo_coste') | float(0) -%}
            {%- if dur > 0 %} Ha durado {{ dur }} minutos, ha consumido {{ ('%.2f' | format(kwh)) | replace('.', ',') }} kilovatios hora
              {%- if eur > 0 %} y ha costado {% if eur < 1 %}unos {{ (eur * 100) | round(0) | int }} céntimos{% else %}{{ ('%.2f' | format(eur)) | replace('.', ',') }} euros{% endif %}{% endif %}.
            {%- endif -%}
          silencio: "{{ now().hour >= 23 or now().hour < 8 }}"
          destinos: >-
            {%- set p = {'person.agustin': 'notify.mobile_app_iphone_aac', 'person.malen': 'notify.mobile_app_iphone_malen'} -%}
            {{ p.items() | selectattr('0', 'is_state', 'home') | map(attribute='1') | list }}
      - if: "{{ not silencio }}"
        then:
          - action: script.turn_on
            target: {entity_id: script.alexa_decir}
            data:
              variables:
                echos: [entrada]
                tipo: anuncio
                mensaje: "{{ mensaje }}"
      - if: "{{ destinos | count > 0 }}"
        then:
          - action: script.notifica
            data:
              titulo: Lavadora
              mensaje: >-
                {{ mensaje }}{% if state_attr(a, 'prob_lluvia') is not none %} (lluvia máx. {{ state_attr(a, 'prob_lluvia') }} %
                {%- if state_attr(a, 'fuente_prevision') == 'diaria' %}, previsión diaria{% endif %}){% endif %}
              nivel: info
              destinos: "{{ destinos }}"
              telegram: none
              tag: lavadora

  # ---------------------------------------------------------------------------
  # PROTECCIÓN: si se corta el enchufe durante un lavado (botón, dashboard), se reactiva
  # ---------------------------------------------------------------------------
  - id: lavadora_proteccion_enchufe
    alias: Lavadora · No cortar durante un lavado
    description: Si el enchufe se apaga con la lavadora lavando, lo vuelve a encender y lo dice por la entrada.
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.grillplats_lavadora
        from: "on"
        to: "off"
    conditions:
      - condition: state
        entity_id: sensor.lavadora_estado
        state: lavando
    actions:
      - delay: "00:00:02"
      - action: switch.turn_on
        target: {entity_id: switch.grillplats_lavadora}
      - action: script.turn_on
        target: {entity_id: script.alexa_decir}
        data:
          variables:
            echos: [entrada]
            tipo: anuncio
            mensaje: "La lavadora está lavando, he vuelto a encender el enchufe. Para pararla, gira el mando."

  # ---------------------------------------------------------------------------
  # Contador mensual
  # ---------------------------------------------------------------------------
  - id: lavadora_reset_contador_mes
    alias: Lavadora · Reset contador mensual
    mode: single
    triggers:
      - trigger: time
        at: "00:00:05"
    conditions:
      - "{{ now().day == 1 }}"
    actions:
      - action: counter.reset
        target: {entity_id: counter.lavadora_lavados_mes}

###############################################################################
#  ALARM HOMY · Automatismos de armado/desarmado (sustituyen a A8, A8X, A9, A10)
#
#  Interruptor general: input_boolean.alarm_homy_automatismos (UI).
#    OFF mientras el motor nuevo convive con la alarma antigua (evita dobles avisos).
#  Horarios editables desde el dashboard (2026-10-12, sustituyen a los helpers schedule.alarm_homy_auto_*):
#    Noche: inicio/fin para las madrugadas de lunes a viernes y para las de sábado y domingo.
#      binary_sensor.alarm_homy_franja_noche → on dentro de la franja: arma Noche al empezar y desarma al terminar.
#      Si inicio > fin (p. ej. 23:30 → 07:00) la franja empieza la noche anterior.
#    Ausente: el auto armado al quedar la casa vacía está permitido SIEMPRE salvo en una excepción semanal
#      (día + desde/hasta; p. ej. jueves 06:30-15:00). binary_sensor.alarm_homy_franja_ausente → on = permitido.
#  Actividad arriba (2026-10-21, ALA-28): binary_sensor.alarm_homy_actividad_estudio = luz de Estudio_Setup encendida,
#    MacBook activo (app HA, binary_sensor.macbook_aac_active_2) o movimiento en la planta alta en 15 min
#    (macro actividad_arriba; atributo motivos). El ping del Mac no sirve: sigue en on con el portátil dormido.
#  CASA NOCTURNO (2026-10-21, ALA-30; sustituye la exclusión del estudio del 16-10): armar Noche (auto o a mano) con
#    actividad arriba arma CASA + input_boolean.alarm_homy_noche_pendiente (lógica en script.alarm_homy_armar).
#    alarm_homy_subida_noche: cada hora en punto y con la actividad 15 min en off → sube a Noche sin desarmar ni
#    tiempo de salida; con puertas/ventanas de Noche abiertas sigue en Casa y reintenta. Un Casa armado a mano
#    (sin pendiente) no sube nunca. Pendiente off al desarmar, al armar otro modo, al subir y al fin de franja.
#    De noche sin voz de Alexa al armar/desarmar (ALA-32, packages/alarm_homy_acciones.yaml).
#  Presencia (2026-10-14): binary_sensor.family_any_home ← sensor.family_home (python_script countpeople)
#    ← binary_sensor.family_home_<x> = helpers de plantilla de la UI:
#       {{ is_state('input_boolean.family_home_<x>', 'on') and is_state('person.<x>', 'home') }}
#    Se mantiene person (no baye_home_<x>): historial 10-13/10, el bayesiano no llega antes y tiene caídas simultáneas.
###############################################################################

input_datetime:
  alarm_homy_noche_inicio_laborable:
    name: Noche L-V · inicio
    icon: mdi:weather-night
    has_date: false
    has_time: true
  alarm_homy_noche_fin_laborable:
    name: Noche L-V · fin
    icon: mdi:weather-sunset-up
    has_date: false
    has_time: true
  alarm_homy_noche_inicio_finde:
    name: Noche S-D · inicio
    icon: mdi:weather-night
    has_date: false
    has_time: true
  alarm_homy_noche_fin_finde:
    name: Noche S-D · fin
    icon: mdi:weather-sunset-up
    has_date: false
    has_time: true
  alarm_homy_ausente_excepcion_desde:
    name: Excepción Ausente · desde
    icon: mdi:clock-start
    has_date: false
    has_time: true
  alarm_homy_ausente_excepcion_hasta:
    name: Excepción Ausente · hasta
    icon: mdi:clock-end
    has_date: false
    has_time: true

input_select:
  alarm_homy_ausente_excepcion_dia:
    name: Excepción Ausente · día
    icon: mdi:calendar-remove
    options: [Ninguno, Lunes, Martes, Miércoles, Jueves, Viernes, Sábado, Domingo]

template:
  - binary_sensor:
      - name: alarm_homy_franja_noche
        unique_id: alarm_homy_franja_noche
        icon: mdi:weather-night
        # Madrugada de sábado y domingo = config "finde"; de lunes a viernes = "laborable"
        state: >-
          {%- set t = now().strftime('%H:%M:%S') -%}
          {%- set fh = 'finde' if now().isoweekday() >= 6 else 'laborable' -%}
          {%- set fm = 'finde' if (now() + timedelta(days=1)).isoweekday() >= 6 else 'laborable' -%}
          {%- set ih = states('input_datetime.alarm_homy_noche_inicio_' ~ fh) -%}
          {%- set fnh = states('input_datetime.alarm_homy_noche_fin_' ~ fh) -%}
          {%- set im = states('input_datetime.alarm_homy_noche_inicio_' ~ fm) -%}
          {%- set fnm = states('input_datetime.alarm_homy_noche_fin_' ~ fm) -%}
          {{ (ih <= fnh and ih <= t < fnh) or (ih > fnh and t < fnh) or (im > fnm and t >= im) }}
        availability: >-
          {{ ['inicio_laborable', 'fin_laborable', 'inicio_finde', 'fin_finde']
             | map('regex_replace', '^', 'input_datetime.alarm_homy_noche_') | select('has_value') | list | count == 4 }}
      # Actividad arriba (ALA-28): el entity_id conserva "estudio" por el histórico y el dashboard
      - name: alarm_homy_actividad_estudio
        unique_id: alarm_homy_actividad_estudio
        icon: mdi:desk
        device_class: occupancy
        state: >-
          {% from 'alarm_homy.jinja' import actividad_arriba %}{{ actividad_arriba() | from_json | count > 0 }}
        attributes:
          motivos: >-
            {% from 'alarm_homy.jinja' import actividad_arriba %}{% set l = actividad_arriba() | from_json %}{{ l | join(', ') if l else 'ninguno' }}
      - name: alarm_homy_franja_ausente
        unique_id: alarm_homy_franja_ausente
        icon: mdi:home-export-outline
        # on = auto armado Ausente permitido (fuera de la excepción semanal)
        state: >-
          {%- set dias = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'] -%}
          {%- set t = now().strftime('%H:%M:%S') -%}
          {%- set excepcion = states('input_select.alarm_homy_ausente_excepcion_dia') == dias[now().weekday()]
                and states('input_datetime.alarm_homy_ausente_excepcion_desde') <= t < states('input_datetime.alarm_homy_ausente_excepcion_hasta') -%}
          {{ not excepcion }}

automation:
  # ---------------------------------------------------------------------------
  # AUTO ARMADO AUSENTE: la familia sale de casa (antes A8 + A8X)
  # ---------------------------------------------------------------------------
  - id: alarm_homy_auto_ausente
    alias: Alarm HOMY · Auto armado Ausente
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.family_any_home
        from: "on"
        to: "off"
        for: {minutes: 2}
    conditions:
      - condition: state
        entity_id: input_boolean.alarm_homy_automatismos
        state: "on"
      - condition: state
        entity_id: binary_sensor.alarm_homy_franja_ausente
        state: "on"
      - condition: state
        entity_id: input_select.alarm_homy_estado
        state: disarmed
    actions:
      - action: script.alarm_homy_armar
        data:
          modo: armed_away
          origen: auto (casa vacía)

  # ---------------------------------------------------------------------------
  # AUTO ARMADO NOCHE: inicio de la franja + reintentos cada 15 min (1-6 h) (antes A9)
  # ---------------------------------------------------------------------------
  - id: alarm_homy_auto_noche
    alias: Alarm HOMY · Auto armado Noche
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.alarm_homy_franja_noche
        from: "off"   # 2026-10-16: no desde unavailable (al recargar plantillas re-armaba Noche)
        to: "on"
        id: inicio
      - trigger: time_pattern
        minutes: "/15"
        id: reintento
    conditions:
      - condition: state
        entity_id: input_boolean.alarm_homy_automatismos
        state: "on"
      - condition: state
        entity_id: binary_sensor.alarm_homy_franja_noche
        state: "on"
      - condition: state
        entity_id: input_select.alarm_homy_estado
        state: disarmed
      - condition: state
        entity_id: binary_sensor.family_any_home
        state: "on"
      - condition: template
        value_template: "{{ trigger.id == 'inicio' or 1 <= now().hour <= 6 }}"
    actions:
      # Con actividad arriba, script.alarm_homy_armar arma Casa nocturno (Casa + noche_pendiente)
      - action: script.alarm_homy_armar
        data:
          modo: armed_night
          origen: "{{ 'auto noche' if trigger.id == 'inicio' else 'auto noche (reintento)' }}"

  # ---------------------------------------------------------------------------
  # AUTO DESARMADO al terminar la franja nocturna (antes A10)
  # ---------------------------------------------------------------------------
  - id: alarm_homy_auto_desarmado_noche
    alias: Alarm HOMY · Auto desarmado fin de noche
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.alarm_homy_franja_noche
        from: "on"
        to: "off"
    actions:
      # Casa nocturno (ALA-30): también se desarma. La pendiente se apaga siempre al terminar la franja.
      - variables:
          nocturno: "{{ is_state('input_select.alarm_homy_estado', 'armed_home') and is_state('input_boolean.alarm_homy_noche_pendiente', 'on') }}"
      - action: input_boolean.turn_off
        target: {entity_id: input_boolean.alarm_homy_noche_pendiente}
      - condition: state
        entity_id: input_boolean.alarm_homy_automatismos
        state: "on"
      - condition: template
        value_template: "{{ is_state('input_select.alarm_homy_estado', 'armed_night') or nocturno }}"
      - condition: state
        entity_id: binary_sensor.family_any_home
        state: "on"
      - action: script.alarm_homy_desarmar
        data:
          validar: false
          origen: auto (fin de noche)
      # ALA-32: sin script.alarm_homy_comprobar (hablaba al desarmar); quedan el bip largo y el LED

  # ---------------------------------------------------------------------------
  # SUBIDA CASA NOCTURNO → NOCHE (2026-10-21, ALA-30): cada hora en punto y cuando la actividad arriba
  # lleva 15 min en off. Directo, sin desarmar ni tiempo de salida. Con bloqueantes de Noche sigue en Casa.
  # ---------------------------------------------------------------------------
  - id: alarm_homy_subida_noche
    alias: Alarm HOMY · Subida Casa nocturno a Noche
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: 0
        id: hora
      - trigger: state
        entity_id: binary_sensor.alarm_homy_actividad_estudio
        to: "off"
        for: {minutes: 15}
        id: actividad
    conditions:
      - condition: state
        entity_id: input_boolean.alarm_homy_noche_pendiente
        state: "on"
      - condition: state
        entity_id: input_select.alarm_homy_estado
        state: armed_home
      - condition: state
        entity_id: binary_sensor.alarm_homy_actividad_estudio
        state: "off"
    actions:
      - variables:
          bloqueantes: >-
            {% from 'alarm_homy.jinja' import bloqueantes %}{{ bloqueantes('armed_night') | from_json }}
      - if:
          - condition: template
            value_template: "{{ bloqueantes | count > 0 }}"
        then:
          - action: logbook.log
            data:
              name: Alarm HOMY
              message: >-
                {% from 'alarm_homy.jinja' import nombres %}sigue en Casa nocturno: no sube a Noche con {{ nombres(bloqueantes) }} abierto
              entity_id: alarm_control_panel.alarm_homy
          - stop: Bloqueantes de Noche
      # Primero el modo y después el estado: alarm_homy_acciones_estado lee el modo al cambiar el estado
      - action: input_boolean.turn_off
        target: {entity_id: input_boolean.alarm_homy_noche_pendiente}
      - action: input_select.select_option
        target: {entity_id: input_select.alarm_homy_modo}
        data: {option: armed_night}
      - action: input_select.select_option
        target: {entity_id: input_select.alarm_homy_estado}
        data: {option: armed_night}
      - action: logbook.log
        data:
          name: Alarm HOMY
          message: "sube de Casa nocturno a Noche ({{ 'sin actividad arriba durante 15 min' if trigger.id == 'actividad' else 'comprobación de las ' ~ now().strftime('%H:00') }})"
          entity_id: alarm_control_panel.alarm_homy
